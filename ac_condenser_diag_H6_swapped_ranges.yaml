type: custom:plotly-graph
hours_to_show: 24h

entities:
  - entity: sensor.ac_total_power
    name: Total Power
    mode: lines+markers
    extend_to_present: false

  - entity: sensor.ac_stage2_current
    name: Stage 2 Current
    mode: markers
    extend_to_present: false

layout:
  height: $ex Math.max(100, window.innerHeight - 95)

  # Diagnostic: assume the card assigned A -> y and W -> y2.
  yaxis:
    range:
      - 0
      - 0.12
    fixedrange: true

  yaxis2:
    range:
      - 1600
      - 3800
    fixedrange: true

config:
  scrollZoom: true
