        }
        if (stale_v49.on_pointerdown) {
          window.removeEventListener("pointerdown", stale_v49.on_pointerdown, true);
        }
        if (stale_v49.on_touchstart) {
          window.removeEventListener("touchstart", stale_v49.on_touchstart, true);
        }
        if (stale_v49.on_wheel) {
          window.removeEventListener("wheel", stale_v49.on_wheel, true);
        }
        if (stale_v49.on_pointerup) {
          window.removeEventListener("pointerup", stale_v49.on_pointerup, true);
        }
        if (stale_v49.initialize_timer_ids) {
          stale_v49.initialize_timer_ids.forEach(clearTimeout);
        }
        delete window.__acCondenserPlotV49Runtime;
      }

      // Clean an earlier v50 runtime if this YAML is hot-reloaded.
      const stale_v50 = window.__acCondenserPlotV50Runtime;
      if (stale_v50) {
        if (stale_v50.on_click) {
          window.removeEventListener("click", stale_v50.on_click, true);
        }
        if (stale_v50.on_pointerdown) {
