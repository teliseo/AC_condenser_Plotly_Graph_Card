# Home Assistant Plotly Graph Card
# A/C condenser power, with clipped display rails and Stage-2 emphasis.
# v34: v33 behavior plus explicit, high-contrast modebar active-state
# indication for Spike Lines, Closest/Compare hover, and Zoom/Pan modes.
#
# Paste this entire file into the card's "Show code editor" in a
# GUI-managed Home Assistant dashboard.
#
# Visible Y range: controlled by Y_MIN_W and Y_MAX_W below.
# Actual values outside that range are plotted ON the appropriate rail,
# but hover text reports the original, unclamped value.
#
# Marker meanings:
#   x             : power < 1 W  (power disconnected / anomaly)
#   square        : 60..80 W     (normal condenser-not-running draw)
#   diamond       : 200.. <350 W  (magenta, 7 px)
#   triangle-down : other values below Y_MIN_W
#   circle        : Y_MIN_W..Y_MAX_W
#   triangle-up   : values above Y_MAX_W (including compressor start spike)
#
# Stage 2:
#   sensor.ac_stage2_current is fetched internally for timestamp pairing; the
#   optional visible trace reuses that cached history. For each Total sample, the
#   first Stage-2-current sample at or AFTER the Total timestamp is treated
#   as timestamp-paired only if it is within +MATCH_TOLERANCE_MS. A Stage-2
#   sample before Total is never considered paired. Paired Stage-2 samples
#   are drawn as squares; unpaired
#   Stage-2 samples are circles. Stage-2 is hidden by default via legendonly.
#   If no close pair exists, the most recent earlier Stage-2 value is still
#   used to color the corresponding power point.

type: custom:plotly-graph

# In live mode this is the current zoom width ("last X hours").
# Browser-local state makes that width survive every card reparse/reconfigure.
hours_to_show: |
  $fn () => {
    window.__acCondenserPlotV22State ??= {
      power: window.__acCondenserPlotV22State?.power ?? true,
      stage2: window.__acCondenserPlotV22State?.stage2 ?? false,
      live: true,
      liveHours: 24
    };
    return window.__acCondenserPlotV22State.liveHours;
  }

# Normal (non-browsing) mode follows entity changes automatically.
# After any manual pan/zoom, Plotly Graph Card deliberately enters browsing
# mode and preserves the exact visible X range. Its built-in ↻ control returns
# to the live 24-hour window.
refresh_interval: auto

# Work around Plotly Graph Card's rendered-trace fetch_mask being indexed
# against the original entity list (which includes internal traces).
# Entity order here is:
#   0 internal Stage-2 helper
#   1 condenser power
#   2 visible Stage-2 trace
# Internal Stage 2 and Total fetch history. The visible Stage-2 trace reuses
# the internal Stage-2 cache instead of issuing a duplicate Recorder fetch.
# This also preserves the workaround for the card's internal-entity mask index.
fetch_mask:
  - true
  - true
  - false

entities:
  # Historical helper trace only. It is not drawn and does not consume
  # another visible Y axis.
  - entity: sensor.ac_stage2_current
    internal: true
    extend_to_present: false

    # ================================================================
    # EASY-TO-CHANGE CONSTANTS
    # Change these values here; the rest of the card references them.
    # ================================================================
    fn: |
      $fn ({states, vars}) => {
        vars.cfg = {
          Y_MIN_W: 1600,
          Y_MAX_W: 4000,
          STAGE2_THRESHOLD_A: 0.07,
          MATCH_TOLERANCE_MS: 5,
          LIVE_EDGE_TOLERANCE_MS: 5000,
          NORMAL_COLOR: "#ff9800",
          STAGE2_COLOR: "#006400",
          MIDRANGE_MIN_W: 200,
          MIDRANGE_MAX_W: 350,
          MIDRANGE_COLOR: "#ff00ff",
          MIDRANGE_MARKER_SIZE_PX: 7,
          LINE_COLOR: "#ffe060",
          RAIL_COLOR: "#8b0000",
          MARKER_SIZE_PX: 5,
          RAIL_MARKER_SIZE_PX: 10
        };

        // Exact timestamp parsing is relatively expensive (regex + Date.parse).
        // Cache it by HA state-object identity across replots. Cached history
        // retains these state objects, and WeakMap does not prevent GC.
        const timestamp_cache =
          window.__acCondenserStateTimestampUsCache ??= new WeakMap();

        const parse_epoch_us = (ts) => {
          if (!ts) return NaN;
          const s = String(ts);
          const m = s.match(
            /^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d+))?(Z|[+-]\d\d:\d\d)$/
          );

          if (!m) {
            const ms = Date.parse(s);
            return Number.isFinite(ms) ? Math.round(ms * 1000) : NaN;
          }

          const whole_seconds_ms = Date.parse(m[1] + m[3]);
          if (!Number.isFinite(whole_seconds_ms)) return NaN;

          const frac_us = Number((m[2] ?? "").padEnd(6, "0").slice(0, 6));
          return whole_seconds_ms * 1000 + frac_us;
        };

        vars.state_epoch_us = (state) => {
          if (!state || typeof state !== "object") return NaN;
          if (timestamp_cache.has(state)) return timestamp_cache.get(state);

          const result = parse_epoch_us(
            state.last_updated ?? state.last_changed
          );
          timestamp_cache.set(state, result);
          return result;
        };

        const n = states.length;
        vars.stage2_times_us = new Array(n);
        vars.stage2_values = new Array(n);

        for (let i = 0; i < n; i++) {
          const state = states[i];
          vars.stage2_times_us[i] = vars.state_epoch_us(state);
          vars.stage2_values[i] = Number(state.state);
        }

        return null;
      }


  - entity: sensor.ac_total_power
    name: Condenser Power
    unit_of_measurement: W
    mode: lines+markers

    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power ? true : "legendonly";
      }

    extend_to_present: false
    cliponaxis: false

    # Keep Plotly's known-good native legend toggle. Before it runs, record
    # the intended state in browser-local state; the next card reparse derives
    # both trace and axis visibility from that state.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.power = !is_visible;

        return true;
      }

    # One pass over Total points performs pairing AND constructs all of the
    # customdata/marker arrays. This avoids several additional full-array passes
    # on every replot.
    #
    # Pairing:
    #   1. Pair only with the first Stage-2 sample at/after the Total timestamp,
    #      and only when its offset is 0..+MATCH_TOLERANCE_MS.
    #   2. Otherwise use the most recent earlier Stage-2 value for coloring.
    # This does NOT alter, resample, add, remove, or move Total points.
    fn: |
      $fn ({states, vars}) => {
        const cfg = vars.cfg;
        const tolerance_us = cfg.MATCH_TOLERANCE_MS * 1000;
        const stage2_times = vars.stage2_times_us ?? [];
        const stage2_values = vars.stage2_values ?? [];

        let j = 0;

        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        const need_stage2_pair_markers =
          window.__acCondenserPlotV22State.stage2;

        vars.stage2_paired_times_us =
          need_stage2_pair_markers ? new Set() : null;

        const n = states.length;
        vars.power_customdata = new Array(n);
        vars.power_symbols = new Array(n);
        vars.power_sizes = new Array(n);
        vars.power_colors = new Array(n);

        for (let i = 0; i < n; i++) {
          const state = states[i];
          const power_time = vars.state_epoch_us(state);

          // First Stage-2 sample at or AFTER Total. Anything before Total is
          // categorically not a timestamp pair.
          while (
            j < stage2_times.length &&
            stage2_times[j] < power_time
          ) {
            j++;
          }

          const candidate_index = j < stage2_times.length ? j : -1;
          const candidate_delta =
            candidate_index >= 0
              ? stage2_times[candidate_index] - power_time
              : NaN;

          const is_pair =
            candidate_index >= 0 &&
            Number.isFinite(stage2_values[candidate_index]) &&
            Number.isFinite(candidate_delta) &&
            candidate_delta >= 0 &&
            candidate_delta <= tolerance_us;

          let stage2_value;

          if (is_pair) {
            stage2_value = stage2_values[candidate_index];
            if (need_stage2_pair_markers) {
              vars.stage2_paired_times_us.add(stage2_times[candidate_index]);
            }
          } else {
            // Held Stage-2 state is only for power-point coloring.
            const held_index = j > 0 ? j - 1 : -1;
            stage2_value =
              held_index >= 0 ? stage2_values[held_index] : NaN;
          }

          const v = Number(state.state);
          const is_idle = v >= 60 && v <= 80;
          const is_midrange =
            v >= cfg.MIDRANGE_MIN_W &&
            v < cfg.MIDRANGE_MAX_W;
          const is_down_arrow =
            v >= 1 &&
            !is_idle &&
            !is_midrange &&
            v < cfg.Y_MIN_W;
          const is_up_arrow = v > cfg.Y_MAX_W;
          const is_rail = is_down_arrow || is_up_arrow;

          let symbol;
          if (!Number.isFinite(v)) symbol = "circle-open";
          else if (v < 1) symbol = "x";
          else if (is_idle) symbol = "square";
          else if (is_midrange) symbol = "diamond";
          else if (is_down_arrow) symbol = "triangle-down";
          else if (is_up_arrow) symbol = "triangle-up";
          else symbol = "circle";

          vars.power_symbols[i] = symbol;
          vars.power_sizes[i] =
            is_midrange
              ? cfg.MIDRANGE_MARKER_SIZE_PX
              : is_rail
                ? cfg.RAIL_MARKER_SIZE_PX
                : cfg.MARKER_SIZE_PX;

          vars.power_colors[i] =
            is_midrange
              ? cfg.MIDRANGE_COLOR
              : is_rail
                ? cfg.RAIL_COLOR
                : stage2_value > cfg.STAGE2_THRESHOLD_A
                  ? cfg.STAGE2_COLOR
                  : cfg.NORMAL_COLOR;

          vars.power_customdata[i] = {
            actual_watts: v,
            stage2_offset_line: is_pair
              ? `<br>Stage-2 sample Δt: +${Math.round(candidate_delta)} µs`
              : ""
          };
        }

        return null;
      }

    customdata: $ex vars.power_customdata

    line:
      color: $ex vars.cfg.LINE_COLOR
      width: 2

    marker:
      symbol: $ex vars.power_symbols

      # Overflow/underflow triangles are larger so they remain visibly
      # triangular at the Y-axis rail. All other markers stay small.
      size: $ex vars.power_sizes

      opacity: 1

      # Rail arrows are dark red. Non-rail points are dark green while
      # Stage 2 is active, otherwise orange.
      color: $ex vars.power_colors

    hovertemplate: |
      <b>Condenser Power</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{customdata.actual_watts:.0f} W%{customdata.stage2_offset_line}<extra></extra>

    # Clamp only the coordinate plotted on the Y axis.
    # The actual value remains untouched in customdata.actual_watts.
    filters:
      - map_y_numbers: Math.max(vars.cfg.Y_MIN_W, Math.min(vars.cfg.Y_MAX_W, y))


  # Visible Stage-2 trace. Plotly Graph Card auto-groups A separately
  # from W; do not explicitly assign yaxis or override axis geometry.
  # Its legend item acts as the native show/hide toggle.
  - entity: sensor.ac_stage2_current
    name: Stage 2
    mode: markers
    extend_to_present: false
    showlegend: true

    # Stage 2 is off by default, but its state persists across card reparses.
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2 ? true : "legendonly";
      }

    # Same mechanism for Stage 2.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.stage2 = !is_visible;

        return true;
      }

    # Build Stage-2 marker arrays only when the trace is actually visible.
    # When legend-hidden, scalar marker values avoid a full timestamp pass.
    fn: |
      $fn ({states, vars}) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        if (!window.__acCondenserPlotV22State.stage2) {
          vars.stage2_symbols = "circle";
          vars.stage2_sizes = 5;
          return null;
        }

        const n = states.length;
        vars.stage2_symbols = new Array(n);
        vars.stage2_sizes = new Array(n);
        const paired_times = vars.stage2_paired_times_us;

        for (let i = 0; i < n; i++) {
          const paired = paired_times?.has(
            vars.state_epoch_us(states[i])
          ) ?? false;
          vars.stage2_symbols[i] = paired ? "square" : "circle";
          vars.stage2_sizes[i] = paired ? 7 : 5;
        }

        return null;
      }

    marker:
      color: "#008b8b"
      symbol: $ex vars.stage2_symbols
      size: $ex vars.stage2_sizes
      opacity: 1

    hovertemplate: |
      <b>Stage 2</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{y:.1f} mA
      <extra></extra>

    filters:
      - map_y_numbers: y * 1000

layout:
  # Runtime glue for sticky-live behavior AND interaction performance.
  #
  # Plotly itself still pans/zooms immediately. Expensive Recorder fetch /
  # YAML parse / Plotly.react work waits until INTERACTION_DEBOUNCE_MS after
  # the last relayout. The stock card's immediate relayout listener is removed
  # for this card instance only.
  meta: |
    $fn () => {
      const STATE_KEY = "__acCondenserPlotV22State";
      const RUNTIME_KEY = "__acCondenserPlotV34Runtime";
      const OLD_RUNTIME_KEY = "__acCondenserPlotV28Runtime";
      const INTERACTION_DEBOUNCE_MS = 225;
      const PREFETCH_FRACTION = 0.25;
      const PREFETCH_MAX_MS = 60 * 60 * 1000;

      window[STATE_KEY] ??= {
        power: true,
        stage2: false,
        live: true,
        liveHours: 24
      };

      const old = window[OLD_RUNTIME_KEY];
      if (old) {
        if (old.on_pointerdown) {
          window.removeEventListener("pointerdown", old.on_pointerdown, true);
        }
        if (old.on_touchstart) {
          window.removeEventListener("touchstart", old.on_touchstart, true);
        }
        if (old.on_wheel) {
          window.removeEventListener("wheel", old.on_wheel, true);
        }
        if (old.on_pointerup) {
          window.removeEventListener("pointerup", old.on_pointerup, true);
        }
        delete window[OLD_RUNTIME_KEY];
      }

      // Clean v33 runtime if this YAML is hot-loaded over it.
      const stale_v33 = window.__acCondenserPlotV33Runtime;
      if (stale_v33) {
        if (stale_v33.on_click) {
          window.removeEventListener("click", stale_v33.on_click, true);
        }
        if (stale_v33.on_pointerdown) {
          window.removeEventListener("pointerdown", stale_v33.on_pointerdown, true);
        }
        if (stale_v33.on_touchstart) {
          window.removeEventListener("touchstart", stale_v33.on_touchstart, true);
        }
        if (stale_v33.on_wheel) {
          window.removeEventListener("wheel", stale_v33.on_wheel, true);
        }
        if (stale_v33.on_pointerup) {
          window.removeEventListener("pointerup", stale_v33.on_pointerup, true);
        }
        delete window.__acCondenserPlotV33Runtime;
      }

      // Clean an earlier v34 runtime if this YAML is hot-reloaded.
      const stale_v34 = window.__acCondenserPlotV34Runtime;
      if (stale_v34) {
        if (stale_v34.on_click) {
          window.removeEventListener("click", stale_v34.on_click, true);
        }
        if (stale_v34.on_pointerdown) {
          window.removeEventListener("pointerdown", stale_v34.on_pointerdown, true);
        }
        if (stale_v34.on_touchstart) {
          window.removeEventListener("touchstart", stale_v34.on_touchstart, true);
        }
        if (stale_v34.on_wheel) {
          window.removeEventListener("wheel", stale_v34.on_wheel, true);
        }
        if (stale_v34.on_pointerup) {
          window.removeEventListener("pointerup", stale_v34.on_pointerup, true);
        }
        delete window.__acCondenserPlotV34Runtime;
      }

      const is_target_card = (el) => {
        if (el?.localName !== "plotly-graph") return false;
        const ents = el.config?.entities ?? [];
        return (
          ents.some((e) => e?.entity === "sensor.ac_total_power") &&
          ents.some((e) => e?.entity === "sensor.ac_stage2_current")
        );
      };

      const card_from_event = (event) =>
        event?.composedPath?.().find(is_target_card);

      const to_ms = (v) => {
        if (typeof v === "number") return v;
        if (v instanceof Date) return v.getTime();
        const ms = new Date(v).getTime();
        return Number.isFinite(ms) ? ms : NaN;
      };

      const normalize_range = (raw) => {
        if (!Array.isArray(raw) || raw.length !== 2) return null;
        const a = to_ms(raw[0]);
        const b = to_ms(raw[1]);
        return Number.isFinite(a) && Number.isFinite(b) && b > a
          ? [a, b]
          : null;
      };

      const range_from_relayout = (event_data) => {
        if (Array.isArray(event_data?.["xaxis.range"])) {
          return normalize_range(event_data["xaxis.range"]);
        }

        if (
          event_data?.["xaxis.range[0]"] !== undefined &&
          event_data?.["xaxis.range[1]"] !== undefined
        ) {
          return normalize_range([
            event_data["xaxis.range[0]"],
            event_data["xaxis.range[1]"]
          ]);
        }

        return null;
      };

      const desired_data_range = (host) => {
        const state = window[STATE_KEY];

        if (state.live) {
          const end = Date.now();
          const hours =
            Number.isFinite(Number(state.liveHours)) &&
            Number(state.liveHours) > 0
              ? Number(state.liveHours)
              : 24;
          return [end - hours * 60 * 60 * 1000, end];
        }

        return (
          normalize_range(host.__acCondenserV27PendingRange) ??
          normalize_range(host.getVisibleRange?.())
        );
      };

      const set_range_mode = (host, range) => {
        if (!is_target_card(host) || !range) return;

        if (host.resetButtonEl) {
          host.resetButtonEl.style.display = "none";
        }

        const [a, b] = range;
        const width = b - a;
        const state = window[STATE_KEY];
        const now = Date.now();

        const raw_max = host.contentEl?.layout?.xaxis?.maxallowed;
        const max_allowed = to_ms(raw_max);

        const at_right_edge =
          b >= now - 5000 ||
          (
            Number.isFinite(max_allowed) &&
            b >= max_allowed - 5000
          );

        host.__acCondenserV27PendingRange = [a, b];

        if (at_right_edge) {
          state.live = true;
          state.liveHours = width / (60 * 60 * 1000);
          host.isBrowsing = false;
        } else {
          state.live = false;
          host.isBrowsing = true;
        }
      };

      const schedule_plot = (host) => {
        clearTimeout(host.__acCondenserV27RelayoutTimer);

        host.__acCondenserV27RelayoutTimer = setTimeout(() => {
          const range = desired_data_range(host);
          if (range && host.configParser) {
            // Prevent the parser's observed range from growing to encompass
            // every historical viewport visited during this browsing session.
            host.configParser.observed_range = range.slice();
          }

          host.plot({should_fetch: true});
        }, INTERACTION_DEBOUNCE_MS);
      };

      const patch_cache = (host) => {
        const cache = host.configParser?.cache;
        if (!cache || cache.__acCondenserV28Patched) return;

        // If v27 was hot-loaded in this page, restore its original getData
        // before replacing it with the v28 implementation.
        if (cache.__acCondenserV27OriginalGetData) {
          cache.getData = cache.__acCondenserV27OriginalGetData;
          delete cache.__acCondenserV27Patched;
        }

        const original_get_data = cache.getData.bind(cache);
        const original_fetch = cache.fetch.bind(cache);
        cache.__acCondenserV28OriginalGetData = original_get_data;
        cache.__acCondenserV28OriginalFetch = original_fetch;

        // Avoid constructing arrays for the entire accumulated history. Binary
        // search the sorted cache and fill only viewport-adjacent rows directly,
        // avoiding v27's intermediate history.slice() allocation and map passes.
        cache.getData = (entity) => {
          if (
            !entity?.entity ||
            Object.prototype.hasOwnProperty.call(entity, "attribute") ||
            Object.prototype.hasOwnProperty.call(entity, "statistic")
          ) {
            return original_get_data(entity);
          }

          const history = cache.histories?.[entity.entity] ?? [];
          const range = desired_data_range(host);

          if (!range || history.length === 0) {
            return original_get_data(entity);
          }

          const [start, end] = range;

          const lower_bound = (target) => {
            let lo = 0;
            let hi = history.length;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (+history[mid].x < target) lo = mid + 1;
              else hi = mid;
            }
            return lo;
          };

          const upper_bound = (target) => {
            let lo = 0;
            let hi = history.length;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (+history[mid].x <= target) lo = mid + 1;
              else hi = mid;
            }
            return lo;
          };

          // Keep one real point on each side when available. The parser's
          // normal removeOutOfRange() then preserves its existing edge behavior.
          const first = Math.max(0, lower_bound(start) - 1);
          const last = Math.min(history.length, upper_bound(end) + 1);
          const count = Math.max(0, last - first);

          const xs = new Array(count);
          const ys = new Array(count);
          const states = new Array(count);

          for (let i = 0; i < count; i++) {
            const row = history[first + i];
            const state = row.state;
            const y = state?.state;

            xs[i] = row.x;
            states[i] = state;
            ys[i] =
              y === "unavailable" ||
              y === "none" ||
              y === "unknown"
                ? null
                : y;
          }

          if (host.configParser) {
            host.configParser.observed_range = range.slice();
          }

          return {
            xs,
            ys,
            states,
            statistics: []
          };
        };

        // Fetch a small margin beyond the requested viewport. This costs little
        // when zoomed in, is capped at one hour per side, and means nearby
        // follow-up pans can usually reuse Recorder history already in cache.
        cache.fetch = (range, entity, hass) => {
          const normalized = normalize_range(range);
          if (!normalized) {
            return original_fetch(range, entity, hass);
          }

          const [start, end] = normalized;
          const width = end - start;
          const margin = Math.min(
            width * PREFETCH_FRACTION,
            PREFETCH_MAX_MS
          );

          return original_fetch(
            [start - margin, end + margin],
            entity,
            hass
          );
        };

        cache.__acCondenserV28Patched = true;
      };

      const update_button_args = (host, event) => {
        const button_el = event?.composedPath?.().find((el) => {
          const raw = el?.className?.baseVal ?? el?.className ?? "";
          return String(raw).split(/\s+/).includes("updatemenu-button");
        });

        const button = button_el?.__data__;
        if (!button) return;

        const label = String(button.label ?? "");
        const range = normalize_range(host.getVisibleRange?.());
        if (!range) return;

        const [a, b] = range;
        const width = b - a;
        const shift = width / 4;
        const now = Date.now();
        const state = window[STATE_KEY];

        if (label === "◀ ¼") {
          button.execute = true;
          button.args = ["xaxis.range", [a - shift, b - shift]];
          return;
        }

        if (label === "↻ 24h") {
          button.execute = true;
          button.args = [
            "xaxis.range",
            [now - 24 * 60 * 60 * 1000, now]
          ];
          return;
        }

        if (label === "¼ ▶") {
          if (state.live) {
            // The visual LIVE button will replace this on the next deferred
            // reparse. Until then, do not allow another forward movement.
            button.execute = false;
            return;
          }

          button.execute = true;
          const new_end = Math.min(now, b + shift);
          button.args = [
            "xaxis.range",
            [new_end - width, new_end]
          ];
          return;
        }

        if (label === "LIVE ▷") {
          button.execute = false;
        }
      };

      const sync_modebar_active = (host) => {
        if (!is_target_card(host)) return;

        const modebar = host.contentEl?.querySelector?.(".modebar");
        if (!modebar) return;

        const full = host.contentEl?._fullLayout ?? {};
        const state = window[STATE_KEY];
        const dragmode = full.dragmode ?? host.contentEl?.layout?.dragmode ?? "zoom";
        const hovermode = full.hovermode ?? host.contentEl?.layout?.hovermode ?? "closest";
        const spikes = state.spikes ?? true;

        const inactive =
          full.modebar?.color ??
          getComputedStyle(host.contentEl).getPropertyValue("--secondary-text-color") ??
          "rgba(127,127,127,.5)";
        const active =
          full.modebar?.activecolor ??
          getComputedStyle(host.contentEl).getPropertyValue("--primary-color") ??
          "rgba(0,127,255,1)";

        const states_by_title = {
          "Zoom": dragmode === "zoom",
          "Pan": dragmode === "pan",
          "Show closest data on hover": hovermode === "closest",
          "Compare data on hover": hovermode === "x" || hovermode === "y",
          "Toggle Spike Lines": spikes
        };

        modebar.querySelectorAll(".modebar-btn").forEach((button) => {
          const title =
            button.getAttribute("data-title") ??
            button.getAttribute("aria-label");
          if (!(title in states_by_title)) return;

          const is_active = Boolean(states_by_title[title]);
          button.classList.toggle("active", is_active);

          const path = button.querySelector(".icon path");
          if (path && !button.matches(":hover")) {
            path.style.fill = is_active ? active : inactive;
          }
        });
      };

      const ensure_host = (host) => {
        if (!is_target_card(host)) return;

        if (host.resetButtonEl) {
          host.resetButtonEl.style.display = "none";
        }

        patch_cache(host);

        // Remove v24's auxiliary relayout listener if this YAML was hot-loaded.
        if (host.__acCondenserV24RelayoutHandler) {
          host.contentEl?.off?.(
            "plotly_relayout",
            host.__acCondenserV24RelayoutHandler
          );
          delete host.__acCondenserV24RelayoutHandler;
        }

        if (host.__acCondenserV27RelayoutHandler) {
          host.contentEl?.off?.(
            "plotly_relayout",
            host.__acCondenserV27RelayoutHandler
          );
          delete host.__acCondenserV27RelayoutHandler;
        }

        if (!host.__acCondenserV28StockRelayoutRemoved) {
          // v27 may already have removed this listener; off() is harmless.
          host.contentEl?.off?.("plotly_relayout", host.onRelayout);
          host.__acCondenserV28StockRelayoutRemoved = true;
        }

        if (!host.__acCondenserV28RelayoutHandler) {
          const handler = (event_data) => {
            if (host.isInternalRelayout) return;

            // Relayout is also emitted for dragmode/hovermode changes.
            setTimeout(() => sync_modebar_active(host), 0);

            const range = range_from_relayout(event_data);
            if (!range) return;

            // Update live/browse state immediately, but defer expensive work.
            set_range_mode(host, range);
            schedule_plot(host);
          };

          host.contentEl?.on?.("plotly_relayout", handler);
          host.__acCondenserV28RelayoutHandler = handler;
        }

        // Modebar may be rebuilt by Plotly.react(); synchronize after the
        // current JS turn so the newly-created buttons are present.
        setTimeout(() => sync_modebar_active(host), 0);
      };

      if (!window[RUNTIME_KEY]) {
        // Intercept the built-in Plotly spike toggle BEFORE its own click
        // handler runs. Plotly's native toggle intentionally changes every
        // Cartesian axis and maintains a global _cartesianSpikesEnabled flag;
        // correcting it afterward leaves that flag out of sync.
        const on_click = (event) => {
          const host = card_from_event(event);
          if (!host) return;

          const button_el = event?.composedPath?.().find((el) => {
            const raw = el?.className?.baseVal ?? el?.className ?? "";
            return String(raw).split(/\s+/).includes("modebar-btn");
          });

          if (!button_el) return;

          const title =
            button_el.getAttribute?.("data-title") ??
            button_el.getAttribute?.("aria-label") ??
            "";

          if (title === "Toggle Spike Lines") {
            // Prevent Plotly's own all-axis click handler from seeing this click.
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            ensure_host(host);

            const state = window[STATE_KEY];
            state.spikes = !(state.spikes ?? true);

            // Re-render from already-cached data. The xaxis.showspikes function
            // reads state.spikes; both Y-axis spikes remain false.
            Promise.resolve(
              host.plot({should_fetch: false})
            ).then(() => {
              sync_modebar_active(host);
            });
            return;
          }

          // Let Plotly handle Zoom/Pan and Closest/Compare normally. Its click
          // handler updates fullLayout; synchronize immediately afterward so
          // active state is obvious even if the theme/default styling is subtle.
          if (
            title === "Zoom" ||
            title === "Pan" ||
            title === "Show closest data on hover" ||
            title === "Compare data on hover"
          ) {
            setTimeout(() => sync_modebar_active(host), 0);
          }
        };

        // Capture runs before Plotly's own button/drag/wheel handlers, allowing
        // us to install the optimized relayout listener before the first
        // plotly_relayout is emitted.
        const on_pointerdown = (event) => {
          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);

          // Native Plotly button args are otherwise frozen at the previous
          // card parse. Refresh them from the current displayed X range so
          // rapid repeated quarter-pan clicks accumulate without waiting.
          update_button_args(host, event);
        };

        const on_touchstart = (event) => {
          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);
          update_button_args(host, event);
        };

        const on_wheel = (event) => {
          const host = card_from_event(event);
          if (host) ensure_host(host);
        };

        // Preserve the proven v26 legend/live behavior. Legend restyle remains
        // intentionally outside the relayout debounce because it is infrequent.
        const is_legend_event = (event) =>
          event?.composedPath?.().some((el) => {
            const raw =
              el?.className?.baseVal ??
              el?.className ??
              "";
            const cls = String(raw);
            return (
              cls.includes("legend") ||
              cls.includes("traces")
            );
          });

        const on_pointerup = (event) => {
          if (!is_legend_event(event)) return;

          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);

          const state = window[STATE_KEY];
          if (!state.live) return;

          const double_click_delay =
            host.contentEl?._context?.doubleClickDelay ?? 300;

          clearTimeout(host.__acCondenserLegendLiveTimer);
          host.__acCondenserLegendLiveTimer = setTimeout(() => {
            if (!state.live) return;

            host.isBrowsing = false;
            if (host.resetButtonEl) {
              host.resetButtonEl.style.display = "none";
            }

            const range = desired_data_range(host);
            if (range && host.configParser) {
              host.configParser.observed_range = range.slice();
            }
          }, double_click_delay + 350);
        };

        window.addEventListener("click", on_click, true);
        window.addEventListener("pointerdown", on_pointerdown, true);
        window.addEventListener("touchstart", on_touchstart, true);
        window.addEventListener(
          "wheel",
          on_wheel,
          {capture: true, passive: true}
        );
        window.addEventListener("pointerup", on_pointerup, true);

        window[RUNTIME_KEY] = {
          ensure_host,
          sync_modebar_active,
          on_click,
          on_pointerdown,
          on_touchstart,
          on_wheel,
          on_pointerup
        };
      }

      return "ac-condenser-v34";
    }

  # Make active modebar state visually obvious. Plotly's defaults use only an
  # opacity change; use HA's normal secondary text color for inactive icons and
  # the theme primary/accent color for active icons.
  modebar:
    color: $ex css_vars["secondary-text-color"]
    activecolor: $ex css_vars["primary-color"]

  # In a Panel view, this makes the graph approximately fill the browser
  # viewport vertically as well as horizontally. Adjust 70 if your HA
  # header/navigation consumes a different amount of vertical space.
  height: $ex Math.max(100, window.innerHeight - 70)

  # Keep normal per-point hover labels and draw a thin vertical dashed
  # spikeline through the hovered/nearest data point.
  hovermode: closest

  legend:
    orientation: h
    x: 0
    xanchor: left
    # Put the legend just above the plotting rectangle.
    "y": 1.02
    yanchor: bottom
    itemdoubleclick: false

  xaxis:
    # Prevent drag/wheel/button panning into the future. This value is
    # re-evaluated whenever the card replots.
    maxallowed: $ex Date.now()

    showspikes: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.spikes ?? true;
      }
    spikemode: across
    spikesnap: data
    spikedash: dash
    spikethickness: 1
    spikecolor: "#808080"

  # One horizontal menu is intentional. Plotly applies 12 px of text
  # padding to each side of every button and a 2 px gap between adjacent
  # buttons, so the whitespace on both sides of ↻ 24h is exactly equal.
  updatemenus:
    - buttons:
        - label: "◀ ¼"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const shift = (b - a) / 4;
                return [a - shift, b - shift];
              }

        - label: "↻ 24h"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn () => {
                const end = Date.now();
                return [end - 24 * 60 * 60 * 1000, end];
              }

        # Historical forward control. Hidden while live.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return !window.__acCondenserPlotV22State.live;
            }
          label: "¼ ▶"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const width = b - a;
                const shift = width / 4;
                const now = Date.now();
                const new_end = Math.min(now, b + shift);
                return [new_end - width, new_end];
              }

        # Live/right-edge indicator occupies the exact same third-button slot.
        # execute:false makes it inert. The hollow arrow distinguishes the
        # disabled state without requiring a separately-positioned menu.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return window.__acCondenserPlotV22State.live;
            }
          label: "LIVE ▷"
          method: skip
          execute: false

      direction: right
      active: -1
      showactive: false
      type: buttons
      bgcolor: "rgba(0,0,0,0)"
      bordercolor: "rgba(0,0,0,0)"
      borderwidth: 0
      font:
        size: 12
      x: 0.42
      xanchor: left
      "y": 1.02
      yanchor: bottom
      pad:
        l: 0
        r: 0
        t: 0
        b: 0

  yaxis:
    showspikes: false
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power;
      }
    title:
      text: Power (W)
    range: $ex [vars.cfg.Y_MIN_W, vars.cfg.Y_MAX_W]
    fixedrange: true

  yaxis2:
    showspikes: false
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2;
      }
    title:
      text: Stage 2 (mA)
    range:
      - 0
      - 120
    fixedrange: true

config:
  # Y is fixed, so wheel/drag zooming affects the time axis.
  scrollZoom: true

  # Explicit modebar policy. Keep PNG export and the normal zoom/pan controls.
  # Remove generic axis-reset controls (they bypass this card's X-history logic)
  # and point-selection controls, which have no consumer here.
  modeBarButtonsToRemove:
    - autoScale2d
    - resetScale2d
    - lasso2d
    - select2d

  # "Compare data on hover" is not itself a toggle, so expose the matching
  # "Show closest data on hover" control as the way back to the default mode.
  # Toggle Spike Lines lets the normally-on vertical spike line be switched.
  modeBarButtonsToAdd:
    - togglespikelines
    - hoverclosest
    - hovercompare
