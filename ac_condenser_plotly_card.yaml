# Home Assistant Plotly Graph Card
# A/C condenser power, with clipped display rails and Stage-2 emphasis.
#
# Paste this entire file into the card's "Show code editor" in a
# GUI-managed Home Assistant dashboard.
#
# Visible Y range: controlled by Y_MIN_W and Y_MAX_W below.
# Actual values outside that range are plotted ON the appropriate rail,
# but hover text reports the original, unclamped value.
#
# Marker meanings:
#   x             : power < 1 W  (power disconnected / anomaly)
#   square        : 60..80 W     (normal condenser-not-running draw)
#   triangle-down : other values below Y_MIN_W
#   circle        : Y_MIN_W..Y_MAX_W
#   triangle-up   : values above Y_MAX_W (including compressor start spike)
#
# Stage 2:
#   sensor.ac_stage2_current is fetched once internally for timestamp pairing
#   and again as an optional visible trace. For each ac_total_power sample, the
#   first Stage-2-current sample at or AFTER the Total timestamp is treated
#   as timestamp-paired only if it is within +MATCH_TOLERANCE_MS. A Stage-2
#   sample before Total is never considered paired. Paired Stage-2 samples
#   are drawn as squares; unpaired
#   Stage-2 samples are circles. Stage-2 is hidden by default via legendonly.
#   If no close pair exists, the most recent earlier Stage-2 value is still
#   used to color the corresponding power point.

type: custom:plotly-graph

# In live mode this is the current zoom width ("last X hours").
# Browser-local state makes that width survive every card reparse/reconfigure.
hours_to_show: |
  $fn () => {
    window.__acCondenserPlotV22State ??= {
      power: window.__acCondenserPlotV22State?.power ?? true,
      stage2: window.__acCondenserPlotV22State?.stage2 ?? false,
      live: true,
      liveHours: 24
    };
    return window.__acCondenserPlotV22State.liveHours;
  }

# Normal (non-browsing) mode follows entity changes automatically.
# After any manual pan/zoom, Plotly Graph Card deliberately enters browsing
# mode and preserves the exact visible X range. Its built-in ↻ control returns
# to the live 24-hour window.
refresh_interval: auto

# Work around Plotly Graph Card's rendered-trace fetch_mask being indexed
# against the original entity list (which includes internal traces).
# Entity order here is:
#   0 internal Stage-2 helper
#   1 condenser power
#   2 visible Stage-2 trace
# Forcing all true ensures historical panning always fetches every source,
# even while Stage 2 is legend-hidden.
fetch_mask:
  - true
  - true
  - true

entities:
  # Historical helper trace only. It is not drawn and does not consume
  # another visible Y axis.
  - entity: sensor.ac_stage2_current
    internal: true
    extend_to_present: false

    # ================================================================
    # EASY-TO-CHANGE CONSTANTS
    # Change these values here; the rest of the card references them.
    # ================================================================
    fn: |
      $fn ({states, vars}) => {
        vars.cfg = {
          Y_MIN_W: 1600,
          Y_MAX_W: 3800,
          STAGE2_THRESHOLD_A: 0.07,
          MATCH_TOLERANCE_MS: 5,
          LIVE_EDGE_TOLERANCE_MS: 5000,
          NORMAL_COLOR: "#ff9800",
          STAGE2_COLOR: "#006400",
          LINE_COLOR: "#ffe060",
          RAIL_COLOR: "#8b0000",
          MARKER_SIZE_PX: 5,
          RAIL_MARKER_SIZE_PX: 10
        };

        // Parse an HA ISO timestamp without losing fractional precision.
        // Returns integer microseconds since Unix epoch.
        vars.to_epoch_us = (ts) => {
          if (!ts) return NaN;
          const s = String(ts);
          const m = s.match(
            /^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d+))?(Z|[+-]\d\d:\d\d)$/
          );

          if (!m) {
            const ms = Date.parse(s);
            return Number.isFinite(ms) ? Math.round(ms * 1000) : NaN;
          }

          const whole_seconds_ms = Date.parse(m[1] + m[3]);
          if (!Number.isFinite(whole_seconds_ms)) return NaN;

          const frac_us = Number((m[2] ?? "").padEnd(6, "0").slice(0, 6));
          return whole_seconds_ms * 1000 + frac_us;
        };

        vars.stage2_times_us = states.map((s) =>
          vars.to_epoch_us(s.last_updated ?? s.last_changed)
        );
        vars.stage2_values = states.map((s) => Number(s.state));

        return null;
      }


  - entity: sensor.ac_total_power
    name: Condenser Power
    unit_of_measurement: W
    mode: lines+markers

    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power ? true : "legendonly";
      }

    extend_to_present: false
    cliponaxis: false

    # Keep Plotly's known-good native legend toggle. Before it runs, record
    # the intended state in browser-local state; the next card reparse derives
    # both trace and axis visibility from that state.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.power = !is_visible;

        return true;
      }

    # For each power point:
    #   1. Pair only with the first Stage-2 sample at/after the Total timestamp,
    #      and only when its offset is 0..+MATCH_TOLERANCE_MS.
    #   2. Otherwise use the most recent earlier Stage-2 value for coloring.
    # This does NOT alter, resample, add, remove, or move power points.
    fn: |
      $fn ({states, vars}) => {
        const cfg = vars.cfg;
        const tolerance_us = cfg.MATCH_TOLERANCE_MS * 1000;
        const stage2_times = vars.stage2_times_us ?? [];
        const stage2_values = vars.stage2_values ?? [];

        let j = 0;

        vars.stage2_at_power = [];
        vars.stage2_match_offset_us = [];
        vars.stage2_paired_times_us = new Set();

        states.forEach((state) => {
          const power_time = vars.to_epoch_us(
            state.last_updated ?? state.last_changed
          );

          // Advance j until it is the first Stage-2 sample at or AFTER
          // power_time. Anything before Total is categorically not a pair.
          while (
            j < stage2_times.length &&
            stage2_times[j] < power_time
          ) {
            j++;
          }

          const candidate_index = j < stage2_times.length ? j : -1;
          const candidate_delta =
            candidate_index >= 0
              ? stage2_times[candidate_index] - power_time
              : NaN;

          const is_pair =
            candidate_index >= 0 &&
            Number.isFinite(stage2_values[candidate_index]) &&
            Number.isFinite(candidate_delta) &&
            candidate_delta >= 0 &&
            candidate_delta <= tolerance_us;

          if (is_pair) {
            // True paired sample. Its offset is necessarily nonnegative.
            vars.stage2_at_power.push(stage2_values[candidate_index]);
            vars.stage2_match_offset_us.push(candidate_delta);
            vars.stage2_paired_times_us.add(stage2_times[candidate_index]);
          } else {
            // No paired Stage-2 history point. The Stage-2 entity state is
            // persistent, so use only the latest STRICTLY EARLIER state for
            // coloring. Never present that held timestamp as a pair.
            const held_index = j > 0 ? j - 1 : -1;
            vars.stage2_at_power.push(
              held_index >= 0 ? stage2_values[held_index] : NaN
            );
            vars.stage2_match_offset_us.push(NaN);
          }
        });

        return null;
      }

    # Keep the original, unclamped wattage and, only for a true forward
    # pair, an entire optional Stage-2 hover line. For an unpaired Total point
    # the string is empty, so there is no "no paired sample" message or label.
    customdata: |
      $fn ({states, vars}) =>
        states.map(({state}, i) => {
          const offset = vars.stage2_match_offset_us?.[i];
          return {
            actual_watts: Number(state),
            stage2_offset_line: Number.isFinite(offset)
              ? `Stage-2 sample Δt: +${Math.round(offset)} µs<br>`
              : ""
          };
        })

    line:
      color: $ex vars.cfg.LINE_COLOR
      width: 2

    marker:
      symbol: |
        $fn ({states, vars}) =>
          states.map(({state}) => {
            const v = Number(state);
            const cfg = vars.cfg;

            if (!Number.isFinite(v)) return "circle-open";
            if (v < 1) return "x";
            if (v >= 60 && v <= 80) return "square";
            if (v < cfg.Y_MIN_W) return "triangle-down";
            if (v > cfg.Y_MAX_W) return "triangle-up";
            return "circle";
          })

      # Overflow/underflow triangles are larger so they remain visibly
      # triangular at the Y-axis rail. All other markers stay small.
      size: |
        $fn ({states, vars}) =>
          states.map(({state}) => {
            const v = Number(state);
            const cfg = vars.cfg;
            const is_down_arrow =
              v >= 1 &&
              !(v >= 60 && v <= 80) &&
              v < cfg.Y_MIN_W;
            const is_up_arrow = v > cfg.Y_MAX_W;

            return is_down_arrow || is_up_arrow
              ? cfg.RAIL_MARKER_SIZE_PX
              : cfg.MARKER_SIZE_PX;
          })

      opacity: 1

      # Rail arrows are always dark red. Other markers are dark green when
      # Stage 2 is active, otherwise orange.
      color: |
        $fn ({states, vars}) =>
          states.map(({state}, i) => {
            const v = Number(state);
            const cfg = vars.cfg;
            const is_down_arrow =
              v >= 1 &&
              !(v >= 60 && v <= 80) &&
              v < cfg.Y_MIN_W;
            const is_up_arrow = v > cfg.Y_MAX_W;

            if (is_down_arrow || is_up_arrow) {
              return cfg.RAIL_COLOR;
            }

            return vars.stage2_at_power?.[i] > cfg.STAGE2_THRESHOLD_A
              ? cfg.STAGE2_COLOR
              : cfg.NORMAL_COLOR;
          })

    hovertemplate: |
      <b>Condenser Power</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{customdata.actual_watts:.0f} W<br>
      %{customdata.stage2_offset_line}<extra></extra>

    # Clamp only the coordinate plotted on the Y axis.
    # The actual value remains untouched in customdata.actual_watts.
    filters:
      - map_y_numbers: Math.max(vars.cfg.Y_MIN_W, Math.min(vars.cfg.Y_MAX_W, y))


  # Visible Stage-2 trace. Plotly Graph Card auto-groups A separately
  # from W; do not explicitly assign yaxis or override axis geometry.
  # Its legend item acts as the native show/hide toggle.
  - entity: sensor.ac_stage2_current
    name: Stage 2
    mode: markers
    extend_to_present: false
    showlegend: true

    # Stage 2 is off by default, but its state persists across card reparses.
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2 ? true : "legendonly";
      }

    # Same mechanism for Stage 2.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.stage2 = !is_visible;

        return true;
      }

    marker:
      color: "#008b8b"

      # A Stage-2 history point selected as a true 0..+tolerance forward
      # match for at least one Total point is highlighted as a square.
      symbol: |
        $fn ({states, vars}) =>
          states.map((s) => {
            const t = vars.to_epoch_us(s.last_updated ?? s.last_changed);
            return vars.stage2_paired_times_us?.has(t)
              ? "square"
              : "circle";
          })

      size: |
        $fn ({states, vars}) =>
          states.map((s) => {
            const t = vars.to_epoch_us(s.last_updated ?? s.last_changed);
            return vars.stage2_paired_times_us?.has(t) ? 7 : 5;
          })

      opacity: 1

    hovertemplate: |
      <b>Stage 2</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{y:.1f} mA
      <extra></extra>

    filters:
      - map_y_numbers: y * 1000

layout:
  # Runtime-only glue for sticky-live behavior. No installed JS files are
  # changed. A capture-phase pointer/wheel listener identifies the exact card
  # before Plotly handles the interaction, then installs a direct
  # plotly_relayout listener on that card.
  meta: |
    $fn () => {
      const STATE_KEY = "__acCondenserPlotV22State";
      const RUNTIME_KEY = "__acCondenserPlotV24Runtime";
      const OLD_RUNTIME_KEY = "__acCondenserPlotV23Runtime";

      window[STATE_KEY] ??= {
        power: true,
        stage2: false,
        live: true,
        liveHours: 24
      };

      // Remove v23's global listeners on a hot reload.
      const old = window[OLD_RUNTIME_KEY];
      if (old) {
        if (old.on_pointerup) {
          window.removeEventListener("pointerup", old.on_pointerup, true);
        }
        if (old.on_touchend) {
          window.removeEventListener("touchend", old.on_touchend, true);
        }
        if (old.on_wheel) {
          window.removeEventListener("wheel", old.on_wheel, true);
        }
        delete window[OLD_RUNTIME_KEY];
      }

      const is_target_card = (el) => {
        if (el?.localName !== "plotly-graph") return false;
        const ents = el.config?.entities ?? [];
        return (
          ents.some((e) => e?.entity === "sensor.ac_total_power") &&
          ents.some((e) => e?.entity === "sensor.ac_stage2_current")
        );
      };

      const card_from_event = (event) =>
        event?.composedPath?.().find(is_target_card);

      const to_ms = (v) => {
        if (typeof v === "number") return v;
        if (v instanceof Date) return v.getTime();
        const ms = new Date(v).getTime();
        return Number.isFinite(ms) ? ms : NaN;
      };

      const range_from_relayout = (event_data) => {
        if (Array.isArray(event_data?.["xaxis.range"])) {
          return event_data["xaxis.range"];
        }

        if (
          event_data?.["xaxis.range[0]"] !== undefined &&
          event_data?.["xaxis.range[1]"] !== undefined
        ) {
          return [
            event_data["xaxis.range[0]"],
            event_data["xaxis.range[1]"]
          ];
        }

        return null;
      };

      const apply_range_mode = (host, raw_range) => {
        if (!is_target_card(host)) return;

        // Our explicit ↻ 24h control replaces the card's reset button.
        if (host.resetButtonEl) {
          host.resetButtonEl.style.display = "none";
        }

        const a = to_ms(raw_range?.[0]);
        const b = to_ms(raw_range?.[1]);
        const width = b - a;
        if (!Number.isFinite(a) || !Number.isFinite(b) || !(width > 0)) {
          return;
        }

        const state = window[STATE_KEY];
        const now = Date.now();

        const raw_max = host.contentEl?.layout?.xaxis?.maxallowed;
        const max_allowed = to_ms(raw_max);

        const at_right_edge =
          b >= now - 5000 ||
          (
            Number.isFinite(max_allowed) &&
            b >= max_allowed - 5000
          );

        if (at_right_edge) {
          state.live = true;
          state.liveHours = width / (60 * 60 * 1000);

          // The card's own relayout listener has just entered browsing mode.
          // Overwrite that before its debounced replot runs.  The replot then
          // evaluates hours_to_show as "last <current zoom width>".
          host.isBrowsing = false;
          host.configParser?.resetObservedRange?.();
          return;
        }

        // Away from the right edge, leave the card in the browsing mode that
        // its own relayout handler just selected.
        state.live = false;
      };

      const ensure_host = (host) => {
        if (!is_target_card(host)) return;

        if (host.resetButtonEl) {
          host.resetButtonEl.style.display = "none";
        }

        if (!host.__acCondenserV24RelayoutHandler) {
          const handler = (event_data) => {
            if (host.isInternalRelayout) return;

            const range = range_from_relayout(event_data);
            if (!range) return;

            apply_range_mode(host, range);
          };

          host.contentEl?.on?.("plotly_relayout", handler);
          host.__acCondenserV24RelayoutHandler = handler;
        }
      };

      if (!window[RUNTIME_KEY]) {
        // Install the direct Plotly listener BEFORE an interaction can emit
        // plotly_relayout.  composedPath() crosses HA shadow-root boundaries.
        const attach_from_event = (event) => {
          const host = card_from_event(event);
          if (host) ensure_host(host);
        };

        const on_pointerdown = (event) => attach_from_event(event);
        const on_touchstart = (event) => attach_from_event(event);
        const on_wheel = (event) => attach_from_event(event);

        // A legend toggle emits plotly_restyle, and the card treats restyle as
        // browsing.  If we were already live, restore normal/live mode only
        // after Plotly's delayed single-click legend action has completed.
        const is_legend_event = (event) =>
          event?.composedPath?.().some((el) => {
            const raw =
              el?.className?.baseVal ??
              el?.className ??
              "";
            const cls = String(raw);
            return (
              cls.includes("legend") ||
              cls.includes("traces")
            );
          });

        const on_pointerup = (event) => {
          if (!is_legend_event(event)) return;

          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);

          const state = window[STATE_KEY];
          if (!state.live) return;

          const double_click_delay =
            host.contentEl?._context?.doubleClickDelay ?? 300;

          clearTimeout(host.__acCondenserLegendLiveTimer);
          host.__acCondenserLegendLiveTimer = setTimeout(() => {
            if (!state.live) return;

            host.isBrowsing = false;
            if (host.resetButtonEl) {
              host.resetButtonEl.style.display = "none";
            }
            host.configParser?.resetObservedRange?.();
          }, double_click_delay + 350);
        };

        window.addEventListener("pointerdown", on_pointerdown, true);
        window.addEventListener("touchstart", on_touchstart, true);
        window.addEventListener(
          "wheel",
          on_wheel,
          {capture: true, passive: true}
        );
        window.addEventListener("pointerup", on_pointerup, true);

        window[RUNTIME_KEY] = {
          ensure_host,
          on_pointerdown,
          on_touchstart,
          on_wheel,
          on_pointerup
        };
      }

      return "ac-condenser-v24";
    }

  # In a Panel view, this makes the graph approximately fill the browser
  # viewport vertically as well as horizontally. Adjust 70 if your HA
  # header/navigation consumes a different amount of vertical space.
  height: $ex Math.max(100, window.innerHeight - 70)

  # Keep normal per-point hover labels and draw a thin vertical dashed
  # spikeline through the hovered/nearest data point.
  hovermode: closest

  legend:
    orientation: h
    x: 0
    xanchor: left
    # Put the legend just above the plotting rectangle.
    "y": 1.02
    yanchor: bottom
    itemdoubleclick: false

  xaxis:
    # Prevent drag/wheel/button panning into the future. This value is
    # re-evaluated whenever the card replots.
    maxallowed: $ex Date.now()

    showspikes: true
    spikemode: across
    spikesnap: data
    spikedash: dash
    spikethickness: 1
    spikecolor: "#808080"

  # One horizontal menu is intentional. Plotly applies 12 px of text
  # padding to each side of every button and a 2 px gap between adjacent
  # buttons, so the whitespace on both sides of ↻ 24h is exactly equal.
  updatemenus:
    - buttons:
        - label: "◀ ¼"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const shift = (b - a) / 4;
                return [a - shift, b - shift];
              }

        - label: "↻ 24h"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn () => {
                const end = Date.now();
                return [end - 24 * 60 * 60 * 1000, end];
              }

        # Historical forward control. Hidden while live.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return !window.__acCondenserPlotV22State.live;
            }
          label: "¼ ▶"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const width = b - a;
                const shift = width / 4;
                const now = Date.now();
                const new_end = Math.min(now, b + shift);
                return [new_end - width, new_end];
              }

        # Live/right-edge indicator occupies the exact same third-button slot.
        # execute:false makes it inert. The hollow arrow distinguishes the
        # disabled state without requiring a separately-positioned menu.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return window.__acCondenserPlotV22State.live;
            }
          label: "LIVE ▷"
          method: skip
          execute: false

      direction: right
      active: -1
      showactive: false
      type: buttons
      bgcolor: "rgba(0,0,0,0)"
      bordercolor: "rgba(0,0,0,0)"
      borderwidth: 0
      font:
        size: 12
      x: 0.42
      xanchor: left
      "y": 1.02
      yanchor: bottom
      pad:
        l: 0
        r: 0
        t: 0
        b: 0

  yaxis:
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power;
      }
    title:
      text: Power (W)
    range: $ex [vars.cfg.Y_MIN_W, vars.cfg.Y_MAX_W]
    fixedrange: true

  yaxis2:
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2;
      }
    title:
      text: Stage 2 (mA)
    range:
      - 0
      - 120
    fixedrange: true

config:
  # Y is fixed, so wheel/drag zooming affects the time axis.
  scrollZoom: true
