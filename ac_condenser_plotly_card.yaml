        delete window.__acCondenserPlotV50Runtime;
      }

      // Clean an earlier v51 runtime if this YAML is hot-reloaded.
      const stale_v51 = window.__acCondenserPlotV51Runtime;
      if (stale_v51) {
        if (stale_v51.on_click) {
          window.removeEventListener("click", stale_v51.on_click, true);
        }
        if (stale_v51.on_pointerdown) {
