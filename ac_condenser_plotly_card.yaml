        if (stale_v51.on_pointerup) {
          window.removeEventListener("pointerup", stale_v51.on_pointerup, true);
        }
        if (stale_v51.initialize_timer_ids) {
          stale_v51.initialize_timer_ids.forEach(clearTimeout);
        }
        delete window.__acCondenserPlotV51Runtime;
      }

      // Clean an earlier v52 runtime if this YAML is hot-reloaded.
      const stale_v52 = window.__acCondenserPlotV52Runtime;
      if (stale_v52) {
        if (stale_v52.on_click) {
          window.removeEventListener("click", stale_v52.on_click, true);
        }
        if (stale_v52.on_pointerdown) {
          window.removeEventListener("pointerdown", stale_v52.on_pointerdown, true);
        }
        if (stale_v52.on_touchstart) {
