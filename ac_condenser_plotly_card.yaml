# Home Assistant Plotly Graph Card
# A/C condenser power, with clipped display rails and Stage-2 emphasis.
# v52: v51 behavior plus real off-screen edge context for Total and Temperature.
# Plotly clips lines/splines at the X-axis edges using real neighboring samples,
# avoiding plotly-graph-card's asymmetric synthetic-left/truncated-right behavior.
#
# Paste this entire file into the card's "Show code editor" in a
# GUI-managed Home Assistant dashboard.
#
# Visible Y range: controlled by Y_MIN_W and Y_MAX_W below.
# Actual values outside that range are plotted ON the appropriate rail,
# but hover text reports the original, unclamped value.
#
# Marker meanings:
#   x             : power < 1 W  (power disconnected / anomaly)
#   square        : 60..80 W     (normal condenser-not-running draw)
#   diamond       : 200.. <350 W  (magenta, 7 px)
#   triangle-down : other values below Y_MIN_W
#   circle        : Y_MIN_W..Y_MAX_W
#   triangle-up   : values above Y_MAX_W (including compressor start spike)
#
# Stage 2:
#   sensor.ac_stage2_current is fetched internally for timestamp pairing; the
#   optional visible trace reuses that cached history. For each Total sample, the
#   first Stage-2-current sample at or AFTER the Total timestamp is treated
#   as timestamp-paired only if it is within +MATCH_TOLERANCE_MS. A Stage-2
#   sample before Total is never considered paired. Paired Stage-2 samples
#   are drawn as squares; unpaired
#   Stage-2 samples are circles. Stage-2 is hidden by default via legendonly.
#   If no close pair exists, the most recent earlier Stage-2 value is still
#   used to color the corresponding power point.

type: custom:plotly-graph

# In live mode this is the current zoom width ("last X hours").
# Browser-local state makes that width survive every card reparse/reconfigure.
hours_to_show: |
  $fn () => {
    window.__acCondenserPlotV22State ??= {
      power: window.__acCondenserPlotV22State?.power ?? true,
      stage2: window.__acCondenserPlotV22State?.stage2 ?? false,
      live: true,
      liveHours: 24
    };
    return window.__acCondenserPlotV22State.liveHours;
  }

# Normal (non-browsing) mode follows entity changes automatically.
# After any manual pan/zoom, Plotly Graph Card deliberately enters browsing
# mode and preserves the exact visible X range. Its built-in ↻ control returns
# to the live 24-hour window.
refresh_interval: auto

# Work around Plotly Graph Card's rendered-trace fetch_mask being indexed
# against the original entity list (which includes internal traces).
# Entity order here is:
#   0 internal Stage-2 helper
#   1 condenser power
#   2 visible Stage-2 trace
#   3 outdoor temperature
# Internal Stage 2, Total, and Outdoor Temperature fetch history. The visible
# Stage-2 trace reuses the internal Stage-2 cache instead of issuing a duplicate
# Recorder fetch. This also preserves the workaround for the card's
# internal-entity mask index.
fetch_mask:
  - true
  - true
  - false
  - true

entities:
  # Historical helper trace only. It is not drawn and does not consume
  # another visible Y axis.
  - entity: sensor.ac_stage2_current
    internal: true
    extend_to_present: false

    # ================================================================
    # EASY-TO-CHANGE CONSTANTS
    # Change these values here; the rest of the card references them.
    # ================================================================
    fn: |
      $fn ({states, vars}) => {
        vars.cfg = {
          Y_MIN_W: 1600,
          Y_MAX_W: 4000,
          STAGE2_THRESHOLD_A: 0.07,
          MATCH_TOLERANCE_MS: 5,
          LIVE_EDGE_TOLERANCE_MS: 5000,
          NORMAL_COLOR: "#ff9800",
          STAGE2_COLOR: "#006400",
          MIDRANGE_MIN_W: 200,
          MIDRANGE_MAX_W: 350,
          MIDRANGE_COLOR: "#ff00ff",
          MIDRANGE_MARKER_SIZE_PX: 7,
          LINE_COLOR: "#ffe060",
          RAIL_COLOR: "#8b0000",
          MARKER_SIZE_PX: 5,
          RAIL_MARKER_SIZE_PX: 10,
          OUTDOOR_TEMP_MIN_F: 15,
          OUTDOOR_TEMP_MAX_F: 120,
          OUTDOOR_TEMP_COLOR: "#7e57c2",
          OUTDOOR_TEMP_SMOOTHING: 0.6,
          OUTDOOR_TEMP_INTERPOLATE_MAX_HOURS: 3.2,
          OUTDOOR_TEMP_LABEL_MIN_PX: 18,
          OUTDOOR_TEMP_LABEL_MIN_Y_PX: 12,
          OUTDOOR_TEMP_LABEL_CHAR_WIDTH_PX: 7,
          OUTDOOR_TEMP_LABEL_HEIGHT_PX: 12,
          OUTDOOR_TEMP_LABEL_FONT_SIZE_PX: 10,
          OUTDOOR_TEMP_LABEL_LINE_CLEARANCE_PX: 3,
          OUTDOOR_TEMP_LABEL_MARKER_SIDE_CLEARANCE_PX: 1,
          OUTDOOR_TEMP_LABEL_CURVE_VETO_DENSITY_FACTOR: 1.35,
          OUTDOOR_TEMP_MARKER_SIZE_PX: 5,
          OUTDOOR_TEMP_INTERP_MARKER_SIZE_PX: 4
        };

        // Exact timestamp parsing is relatively expensive (regex + Date.parse).
        // Cache it by HA state-object identity across replots. Cached history
        // retains these state objects, and WeakMap does not prevent GC.
        const timestamp_cache =
          window.__acCondenserStateTimestampUsCache ??= new WeakMap();

        const parse_epoch_us = (ts) => {
          if (!ts) return NaN;
          const s = String(ts);
          const m = s.match(
            /^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d+))?(Z|[+-]\d\d:\d\d)$/
          );

          if (!m) {
            const ms = Date.parse(s);
            return Number.isFinite(ms) ? Math.round(ms * 1000) : NaN;
          }

          const whole_seconds_ms = Date.parse(m[1] + m[3]);
          if (!Number.isFinite(whole_seconds_ms)) return NaN;

          const frac_us = Number((m[2] ?? "").padEnd(6, "0").slice(0, 6));
          return whole_seconds_ms * 1000 + frac_us;
        };

        vars.state_epoch_us = (state) => {
          if (!state || typeof state !== "object") return NaN;
          if (timestamp_cache.has(state)) return timestamp_cache.get(state);

          const result = parse_epoch_us(
            state.last_updated ?? state.last_changed
          );
          timestamp_cache.set(state, result);
          return result;
        };

        const n = states.length;
        vars.stage2_times_us = new Array(n);
        vars.stage2_values = new Array(n);

        for (let i = 0; i < n; i++) {
          const state = states[i];
          vars.stage2_times_us[i] = vars.state_epoch_us(state);
          vars.stage2_values[i] = Number(state.state);
        }

        return null;
      }


  - entity: sensor.ac_total_power
    name: Condenser Power
    unit_of_measurement: W
    mode: lines+markers

    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power ? true : "legendonly";
      }

    extend_to_present: false
    cliponaxis: false

    # Keep Plotly's known-good native legend toggle. Before it runs, record
    # the intended state in browser-local state; the next card reparse derives
    # both trace and axis visibility from that state.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.power = !is_visible;

        return true;
      }

    # One pass over Total points performs pairing AND constructs all of the
    # customdata/marker arrays. This avoids several additional full-array passes
    # on every replot.
    #
    # Pairing:
    #   1. Pair only with the first Stage-2 sample at/after the Total timestamp,
    #      and only when its offset is 0..+MATCH_TOLERANCE_MS.
    #   2. Otherwise use the most recent earlier Stage-2 value for coloring.
    # This does NOT alter, resample, add, remove, or move Total points.
    fn: |
      $fn ({states, xs, ys, vars, getFromConfig}) => {
        const cfg = vars.cfg;

        const to_ms = (v) => {
          if (v instanceof Date) return v.getTime();
          if (typeof v === "number") return v;
          const ms = Date.parse(String(v ?? ""));
          return Number.isFinite(ms) ? ms : NaN;
        };

        const visible = getFromConfig("visible_range");
        const view_start = to_ms(visible?.[0]);
        const view_end = to_ms(visible?.[1]);

        const edge_context =
          window.__acCondenserEdgeContextV52?.power;

        const context_matches =
          edge_context &&
          Number.isFinite(view_start) &&
          Number.isFinite(view_end) &&
          Math.abs(edge_context.range?.[0] - view_start) < 2 &&
          Math.abs(edge_context.range?.[1] - view_end) < 2;

        if (context_matches && edge_context.rows?.length) {
          const rebuilt = [];

          for (const row of edge_context.rows) {
            const state = row?.state;
            if (!state) continue;

            const actual_ms = Date.parse(
              state.last_updated ??
              state.last_changed ??
              ""
            );

            const x_ms =
              Number.isFinite(actual_ms)
                ? actual_ms
                : Number(row.x);

            if (!Number.isFinite(x_ms)) continue;

            rebuilt.push({
              x_ms,
              state,
              y: (
                state.state === "unavailable" ||
                state.state === "none" ||
                state.state === "unknown"
              )
                ? null
                : Number(state.state)
            });
          }

          rebuilt.sort((a, b) => a.x_ms - b.x_ms);

          xs.length = rebuilt.length;
          ys.length = rebuilt.length;
          states.length = rebuilt.length;

          for (let i = 0; i < rebuilt.length; i++) {
            xs[i] = new Date(rebuilt[i].x_ms);
            ys[i] = rebuilt[i].y;
            states[i] = rebuilt[i].state;
          }
        }
        const tolerance_us = cfg.MATCH_TOLERANCE_MS * 1000;
        const stage2_times = vars.stage2_times_us ?? [];
        const stage2_values = vars.stage2_values ?? [];

        let j = 0;

        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        const need_stage2_pair_markers =
          window.__acCondenserPlotV22State.stage2;

        vars.stage2_paired_times_us =
          need_stage2_pair_markers ? new Set() : null;

        const n = states.length;
        vars.power_customdata = new Array(n);
        vars.power_symbols = new Array(n);
        vars.power_sizes = new Array(n);
        vars.power_colors = new Array(n);

        for (let i = 0; i < n; i++) {
          const state = states[i];
          const power_time = vars.state_epoch_us(state);

          // First Stage-2 sample at or AFTER Total. Anything before Total is
          // categorically not a timestamp pair.
          while (
            j < stage2_times.length &&
            stage2_times[j] < power_time
          ) {
            j++;
          }

          const candidate_index = j < stage2_times.length ? j : -1;
          const candidate_delta =
            candidate_index >= 0
              ? stage2_times[candidate_index] - power_time
              : NaN;

          const is_pair =
            candidate_index >= 0 &&
            Number.isFinite(stage2_values[candidate_index]) &&
            Number.isFinite(candidate_delta) &&
            candidate_delta >= 0 &&
            candidate_delta <= tolerance_us;

          let stage2_value;

          if (is_pair) {
            stage2_value = stage2_values[candidate_index];
            if (need_stage2_pair_markers) {
              vars.stage2_paired_times_us.add(stage2_times[candidate_index]);
            }
          } else {
            // Held Stage-2 state is only for power-point coloring.
            const held_index = j > 0 ? j - 1 : -1;
            stage2_value =
              held_index >= 0 ? stage2_values[held_index] : NaN;
          }

          const v = Number(state.state);
          const is_idle = v >= 60 && v <= 80;
          const is_midrange =
            v >= cfg.MIDRANGE_MIN_W &&
            v < cfg.MIDRANGE_MAX_W;
          const is_down_arrow =
            v >= 1 &&
            !is_idle &&
            !is_midrange &&
            v < cfg.Y_MIN_W;
          const is_up_arrow = v > cfg.Y_MAX_W;
          const is_rail = is_down_arrow || is_up_arrow;

          let symbol;
          if (!Number.isFinite(v)) symbol = "circle-open";
          else if (v < 1) symbol = "x";
          else if (is_idle) symbol = "square";
          else if (is_midrange) symbol = "diamond";
          else if (is_down_arrow) symbol = "triangle-down";
          else if (is_up_arrow) symbol = "triangle-up";
          else symbol = "circle";

          vars.power_symbols[i] = symbol;
          const x_ms = +xs[i];
          const is_offscreen =
            Number.isFinite(view_start) &&
            Number.isFinite(view_end) &&
            (x_ms < view_start || x_ms > view_end);

          vars.power_sizes[i] =
            is_offscreen
              ? 0
              : is_midrange
                ? cfg.MIDRANGE_MARKER_SIZE_PX
                : is_rail
                  ? cfg.RAIL_MARKER_SIZE_PX
                  : cfg.MARKER_SIZE_PX;

          vars.power_colors[i] =
            is_midrange
              ? cfg.MIDRANGE_COLOR
              : is_rail
                ? cfg.RAIL_COLOR
                : stage2_value > cfg.STAGE2_THRESHOLD_A
                  ? cfg.STAGE2_COLOR
                  : cfg.NORMAL_COLOR;

          vars.power_customdata[i] = {
            actual_watts: v,
            stage2_offset_line: is_pair
              ? `<br>Stage-2 sample Δt: +${Math.round(candidate_delta)} µs`
              : ""
          };
        }

        return null;
      }

    customdata: $ex vars.power_customdata

    line:
      color: $ex vars.cfg.LINE_COLOR
      width: 2
      shape: linear

    # Explicit rather than relying on Plotly's default. Null/unknown samples
    # break the Total line; elapsed time alone does not.
    connectgaps: false

    marker:
      symbol: $ex vars.power_symbols

      # Overflow/underflow triangles are larger so they remain visibly
      # triangular at the Y-axis rail. All other markers stay small.
      size: $ex vars.power_sizes

      opacity: 1

      # Rail arrows are dark red. Non-rail points are dark green while
      # Stage 2 is active, otherwise orange.
      color: $ex vars.power_colors

    hovertemplate: |
      <b>Condenser Power</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{customdata.actual_watts:.0f} W%{customdata.stage2_offset_line}<extra></extra>

    # Clamp only the coordinate plotted on the Y axis.
    # The actual value remains untouched in customdata.actual_watts.
    filters:
      - map_y_numbers: Math.max(vars.cfg.Y_MIN_W, Math.min(vars.cfg.Y_MAX_W, y))


  # Visible Stage-2 trace. Plotly Graph Card auto-groups A separately
  # from W; do not explicitly assign yaxis or override axis geometry.
  # Its legend item acts as the native show/hide toggle.
  - entity: sensor.ac_stage2_current
    name: Stage 2
    mode: markers
    extend_to_present: false
    showlegend: true

    # Stage 2 is off by default, but its state persists across card reparses.
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2 ? true : "legendonly";
      }

    # Same mechanism for Stage 2.
    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.stage2 = !is_visible;

        return true;
      }

    # Build Stage-2 marker arrays only when the trace is actually visible.
    # When legend-hidden, scalar marker values avoid a full timestamp pass.
    fn: |
      $fn ({states, vars}) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        if (!window.__acCondenserPlotV22State.stage2) {
          vars.stage2_symbols = "circle";
          vars.stage2_sizes = 5;
          return null;
        }

        const n = states.length;
        vars.stage2_symbols = new Array(n);
        vars.stage2_sizes = new Array(n);
        const paired_times = vars.stage2_paired_times_us;

        for (let i = 0; i < n; i++) {
          const paired = paired_times?.has(
            vars.state_epoch_us(states[i])
          ) ?? false;
          vars.stage2_symbols[i] = paired ? "square" : "circle";
          vars.stage2_sizes[i] = paired ? 7 : 5;
        }

        return null;
      }

    marker:
      color: "#008b8b"
      symbol: $ex vars.stage2_symbols
      size: $ex vars.stage2_sizes
      opacity: 1

    hovertemplate: |
      <b>Stage 2</b><br>
      %{x|%Y-%m-%d %H:%M:%S.%L}<br>
      %{y:.1f} mA
      <extra></extra>

    filters:
      - map_y_numbers: y * 1000


  # Outdoor temperature. `attribute: source_ts` is intentional even though
  # the plotted Y value is the entity state. In Plotly Graph Card v3.3.5 an
  # attribute trace fetches complete HA history rows (attributes included) and
  # does NOT request minimal_response/no_attributes. This preserves repeated
  # temperatures and attribute-only updates. The fn below rebuilds X from
  # source_ts and Y from state.
  - entity: sensor.outdoor_temperature
    attribute: source_ts
    name: Outdoor Temperature
    unit_of_measurement: "°F"
    mode: lines+markers+text
    extend_to_present: false
    showlegend: true
    cliponaxis: false

    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return (window.__acCondenserPlotV22State.outdoor ?? true)
          ? true
          : "legendonly";
      }

    on_legend_click: |
      $fn () => (event_data) => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };

        const trace = event_data.data?.[event_data.curveNumber];
        const is_visible =
          trace?.visible !== false && trace?.visible !== "legendonly";
        window.__acCondenserPlotV22State.outdoor = !is_visible;

        return true;
      }

    fn: |
      $fn ({states, xs, ys, vars, getFromConfig}) => {
        const cfg = vars.cfg;
        const state_store =
          window.__acCondenserPlotV22State ??= {
            power: true,
            stage2: false,
            live: true,
            liveHours: 24
          };

        const to_ms = (v) => {
          if (v instanceof Date) return v.getTime();

          // source_ts is normally a Unix epoch timestamp in seconds, e.g.
          // 1786919482.341296. Also accept millisecond epochs and numeric
          // strings defensively.
          const numeric =
            typeof v === "number"
              ? v
              : (
                  typeof v === "string" &&
                  v.trim() !== "" &&
                  Number.isFinite(Number(v))
                )
                ? Number(v)
                : NaN;

          if (Number.isFinite(numeric)) {
            // Contemporary Unix seconds are ~1e9; epoch milliseconds are ~1e12.
            return Math.abs(numeric) < 1e11
              ? numeric * 1000
              : numeric;
          }

          // Fallback for any future ISO-style source timestamp.
          const ms = Date.parse(String(v ?? ""));
          return Number.isFinite(ms) ? ms : NaN;
        };

        const visible = getFromConfig("visible_range");
        const view_start = to_ms(visible?.[0]);
        const view_end = to_ms(visible?.[1]);

        const edge_context =
          window.__acCondenserEdgeContextV52?.temperature;

        const context_matches =
          edge_context &&
          Number.isFinite(view_start) &&
          Number.isFinite(view_end) &&
          Math.abs(edge_context.range?.[0] - view_start) < 2 &&
          Math.abs(edge_context.range?.[1] - view_end) < 2;

        const source_states =
          context_matches && edge_context.rows?.length
            ? edge_context.rows
                .map((row) => row?.state)
                .filter(Boolean)
            : states;

        const is_missing_temp = (v) => {
          if (v === null || v === undefined) return true;
          const s = String(v).trim().toLowerCase();
          return (
            s === "" ||
            s === "unknown" ||
            s === "unavailable" ||
            s === "none" ||
            !Number.isFinite(Number(v))
          );
        };

        // Rebuild by source_ts. An exact duplicate source_ts collapses to the
        // latest Recorder row, while equal temperatures at different source_ts
        // remain separate samples.
        const by_source_ts = new Map();

        for (let i = 0; i < source_states.length; i++) {
          const st = source_states[i];
          const t = to_ms(st?.attributes?.source_ts);
          if (!Number.isFinite(t)) continue;

          const raw = st?.state;
          const missing = is_missing_temp(raw);
          const condition_raw = st?.attributes?.condition;
          const condition =
            condition_raw === null || condition_raw === undefined
              ? ""
              : String(condition_raw);

          by_source_ts.set(t, {
            t,
            y: missing ? null : Number(raw),
            condition,
            interpolated: false
          });
        }

        const rows = Array.from(by_source_ts.values())
          .sort((a, b) => a.t - b.t);

        // Fill only short, bounded blocks of unknown samples. The furthest
        // unknown from EACH bracketing valid sample must be <= 3.2 hours.
        // With roughly hourly reporting this admits at most three consecutive
        // unknown samples. Interpolation is linear in source time.
        const max_gap_ms =
          cfg.OUTDOOR_TEMP_INTERPOLATE_MAX_HOURS * 60 * 60 * 1000;

        let i = 0;
        while (i < rows.length) {
          if (rows[i].y !== null) {
            i++;
            continue;
          }

          const block_start = i;
          while (i < rows.length && rows[i].y === null) i++;
          const block_end = i - 1;
          const left_i = block_start - 1;
          const right_i = i;

          if (
            left_i < 0 ||
            right_i >= rows.length ||
            rows[left_i].y === null ||
            rows[right_i].y === null
          ) {
            continue;
          }

          const left = rows[left_i];
          const right = rows[right_i];
          const furthest_from_left =
            rows[block_end].t - left.t;
          const furthest_from_right =
            right.t - rows[block_start].t;

          if (
            furthest_from_left > max_gap_ms ||
            furthest_from_right > max_gap_ms ||
            right.t <= left.t
          ) {
            continue;
          }

          const dt = right.t - left.t;
          const dy = right.y - left.y;

          for (let k = block_start; k <= block_end; k++) {
            const f = (rows[k].t - left.t) / dt;
            rows[k].y = left.y + f * dy;
            rows[k].condition = "";
            rows[k].interpolated = true;
          }
        }

        // Even when both adjacent samples are valid, do not visually imply
        // continuity across an extended period with no source data. Insert a
        // synthetic null midway between adjacent recorded samples separated by
        // more than 3.2 hours. Plotly's default connectgaps:false then breaks
        // the spline at that point. Existing long unknown blocks already
        // contain nulls and therefore need no additional synthetic break.
        const plotted_rows = [];

        for (let j = 0; j < rows.length; j++) {
          const current = rows[j];
          plotted_rows.push(current);

          if (j + 1 >= rows.length) continue;

          const next = rows[j + 1];
          if (
            current.y !== null &&
            next.y !== null &&
            next.t - current.t > max_gap_ms
          ) {
            plotted_rows.push({
              t: current.t + (next.t - current.t) / 2,
              y: null,
              condition: "",
              interpolated: false,
              synthetic_gap: true
            });
          }
        }

        xs.length = plotted_rows.length;
        ys.length = plotted_rows.length;

        vars.outdoor_temp_customdata = new Array(plotted_rows.length);
        vars.outdoor_temp_text = new Array(plotted_rows.length).fill("");
        vars.outdoor_temp_textposition = new Array(plotted_rows.length).fill("top center");
        vars.outdoor_temp_marker_sizes = new Array(plotted_rows.length);

        for (let j = 0; j < plotted_rows.length; j++) {
          const row = plotted_rows[j];
          xs[j] = new Date(row.t);
          ys[j] = row.y;

          const rounded =
            row.y === null ? null : Math.round(row.y);

          let hover = "";
          if (rounded !== null) {
            if (row.interpolated) {
              hover = `~${rounded} °F`;
            } else {
              hover = `${rounded} °F`;
              if (
                row.condition &&
                row.condition.toLowerCase() !== "unavailable"
              ) {
                hover += ` · ${row.condition}`;
              }
            }
          }

          vars.outdoor_temp_customdata[j] = {
            hover,
            interpolated: row.interpolated
          };

          const is_offscreen =
            Number.isFinite(view_start) &&
            Number.isFinite(view_end) &&
            (row.t < view_start || row.t > view_end);

          vars.outdoor_temp_marker_sizes[j] =
            is_offscreen
              ? 0
              : row.interpolated
                ? cfg.OUTDOOR_TEMP_INTERP_MARKER_SIZE_PX
                : cfg.OUTDOOR_TEMP_MARKER_SIZE_PX;
        }

        // Plotly scatter text does not auto-place or avoid collisions for us.
        // We therefore:
        //   1) estimate each label's screen-space point,
        //   2) classify extrema / endpoints / ordinary points,
        //   3) choose among top/bottom/corner positions per point,
        //   4) accept labels greedily by priority using actual label-box overlap.
        //
        // This allows a daily high and daily low to coexist even when close in
        // time, and lets minima prefer positions below the trough while maxima
        // prefer positions above the crest.
        let x0 = view_start;
        let x1 = view_end;

        if (
          !Number.isFinite(x0) ||
          !Number.isFinite(x1) ||
          x1 <= x0
        ) {
          const finite_rows = plotted_rows.filter((r) => r.y !== null);
          if (finite_rows.length) {
            x0 = finite_rows[0].t;
            x1 = finite_rows[finite_rows.length - 1].t;
          }
        }

        const plot_width =
          Number.isFinite(Number(state_store.plotWidthPx)) &&
          Number(state_store.plotWidthPx) > 0
            ? Number(state_store.plotWidthPx)
            : Math.max(250, window.innerWidth - 120);

        const plot_height =
          Number.isFinite(Number(state_store.plotHeightPx)) &&
          Number(state_store.plotHeightPx) > 0
            ? Number(state_store.plotHeightPx)
            : Math.max(180, window.innerHeight - 220);

        const min_label_px = cfg.OUTDOOR_TEMP_LABEL_MIN_PX;
        const min_label_y_px = cfg.OUTDOOR_TEMP_LABEL_MIN_Y_PX;
        const char_width_px = cfg.OUTDOOR_TEMP_LABEL_CHAR_WIDTH_PX;
        const label_height_px = cfg.OUTDOOR_TEMP_LABEL_HEIGHT_PX;

        const span = x1 - x0;
        const y_min = cfg.OUTDOOR_TEMP_MIN_F;
        const y_max = cfg.OUTDOOR_TEMP_MAX_F;
        const y_span = y_max - y_min;

        const px_at = (t) =>
          Number.isFinite(span) && span > 0
            ? ((t - x0) / span) * plot_width
            : 0;

        const py_at = (y) =>
          Number.isFinite(y) && Number.isFinite(y_span) && y_span > 0
            ? (1 - ((y - y_min) / y_span)) * plot_height
            : plot_height / 2;

        // Screen-space sample density controls whether the expensive/strict
        // curve-vs-label veto is needed. At sparse zoom levels a label no
        // longer spans multiple neighboring samples, so applying the dense-view
        // veto only removes useful labels without adding meaningful protection.
        const visible_sample_dx = [];
        let previous_visible_x = null;

        for (const row of plotted_rows) {
          if (
            row.y === null ||
            row.t < x0 ||
            row.t > x1
          ) {
            continue;
          }

          const x = px_at(row.t);

          if (previous_visible_x !== null) {
            const dx = x - previous_visible_x;
            if (Number.isFinite(dx) && dx > 0) {
              visible_sample_dx.push(dx);
            }
          }

          previous_visible_x = x;
        }

        visible_sample_dx.sort((a, b) => a - b);

        const median_sample_dx =
          visible_sample_dx.length
            ? (
                visible_sample_dx.length % 2
                  ? visible_sample_dx[
                      Math.floor(visible_sample_dx.length / 2)
                    ]
                  : (
                      visible_sample_dx[
                        visible_sample_dx.length / 2 - 1
                      ] +
                      visible_sample_dx[
                        visible_sample_dx.length / 2
                      ]
                    ) / 2
              )
            : Infinity;

        // Identify local extrema plateau-by-plateau, not point-by-point.
        // This avoids false extrema at a flat step in a continuing trend:
        //   65,64,64,63  => the 64 plateau is NOT a minimum
        //   81,87,87,91  => the 87 plateau is NOT a maximum
        // while correctly retaining:
        //   63,62,62,63  => one representative 62 is a minimum
        //   94,95,95,93  => one representative 95 is a maximum
        const extremum_representatives = new Map();

        let segment_start = 0;
        while (segment_start < plotted_rows.length) {
          while (
            segment_start < plotted_rows.length &&
            plotted_rows[segment_start].y === null
          ) {
            segment_start++;
          }
          if (segment_start >= plotted_rows.length) break;

          let segment_end = segment_start;
          while (
            segment_end + 1 < plotted_rows.length &&
            plotted_rows[segment_end + 1].y !== null
          ) {
            segment_end++;
          }

          let plateau_start = segment_start;
          while (plateau_start <= segment_end) {
            let plateau_end = plateau_start;
            const plateau_y = plotted_rows[plateau_start].y;

            while (
              plateau_end + 1 <= segment_end &&
              plotted_rows[plateau_end + 1].y === plateau_y
            ) {
              plateau_end++;
            }

            if (
              plateau_start > segment_start &&
              plateau_end < segment_end
            ) {
              const prev_y = plotted_rows[plateau_start - 1].y;
              const next_y = plotted_rows[plateau_end + 1].y;

              let extremum_kind = null;
              if (plateau_y < prev_y && plateau_y < next_y) {
                extremum_kind = "min";
              } else if (plateau_y > prev_y && plateau_y > next_y) {
                extremum_kind = "max";
              }

              if (extremum_kind) {
                const mid_t =
                  (
                    plotted_rows[plateau_start].t +
                    plotted_rows[plateau_end].t
                  ) / 2;

                let representative = plateau_start;
                let best_distance = Math.abs(
                  plotted_rows[plateau_start].t - mid_t
                );

                for (
                  let k = plateau_start + 1;
                  k <= plateau_end;
                  k++
                ) {
                  const distance = Math.abs(
                    plotted_rows[k].t - mid_t
                  );
                  if (distance < best_distance) {
                    best_distance = distance;
                    representative = k;
                  }
                }

                extremum_representatives.set(
                  representative,
                  extremum_kind
                );
              }
            }

            plateau_start = plateau_end + 1;
          }

          segment_start = segment_end + 1;
        }

        // Assign a stable top/bottom label lane to every valid sample.
        //
        // Between genuine extrema the lane does not change:
        //   after a minimum / while rising  -> bottom of the curve
        //   after a maximum / while falling -> top of the curve
        //
        // The extrema themselves use their semantic sides (max top, min bottom).
        // A null gap starts a new segment. This is intentionally stronger than
        // v45's "preference": a later collision will thin labels instead of
        // switching an ordinary label to the opposite side.
        const lane_by_index =
          new Array(plotted_rows.length).fill(null);
        const run_id_by_index =
          new Array(plotted_rows.length).fill(-1);

        let next_run_id = 0;
        let lane_segment_start = 0;

        while (lane_segment_start < plotted_rows.length) {
          while (
            lane_segment_start < plotted_rows.length &&
            plotted_rows[lane_segment_start].y === null
          ) {
            lane_segment_start++;
          }
          if (lane_segment_start >= plotted_rows.length) break;

          let lane_segment_end = lane_segment_start;
          while (
            lane_segment_end + 1 < plotted_rows.length &&
            plotted_rows[lane_segment_end + 1].y !== null
          ) {
            lane_segment_end++;
          }

          const extrema_in_segment = [];
          for (
            let k = lane_segment_start;
            k <= lane_segment_end;
            k++
          ) {
            const kind = extremum_representatives.get(k);
            if (kind) {
              extrema_in_segment.push({i: k, kind});
            }
          }

          let current_lane;
          if (extrema_in_segment.length) {
            // Before the first visible knee, infer which side corresponds to
            // the monotonic run leading into that extremum.
            current_lane =
              extrema_in_segment[0].kind === "max"
                ? "bottom"
                : "top";
          } else {
            // No visible knee: use the net segment direction.
            const first_y = plotted_rows[lane_segment_start].y;
            const last_y = plotted_rows[lane_segment_end].y;
            current_lane =
              last_y > first_y
                ? "bottom"
                : last_y < first_y
                  ? "top"
                  : (
                      first_y >=
                      (cfg.OUTDOOR_TEMP_MIN_F +
                       cfg.OUTDOOR_TEMP_MAX_F) / 2
                        ? "top"
                        : "bottom"
                    );
          }

          let current_run_id = next_run_id++;

          for (
            let k = lane_segment_start;
            k <= lane_segment_end;
            k++
          ) {
            const extremum_kind =
              extremum_representatives.get(k);

            if (extremum_kind) {
              const extremum_lane =
                extremum_kind === "max"
                  ? "top"
                  : "bottom";

              lane_by_index[k] = extremum_lane;
              run_id_by_index[k] = -1;

              // A true extremum is the knee where the ordinary-label lane is
              // allowed to change for subsequent samples.
              current_lane = extremum_lane;
              current_run_id = next_run_id++;
            } else {
              lane_by_index[k] = current_lane;
              run_id_by_index[k] = current_run_id;
            }
          }

          lane_segment_start = lane_segment_end + 1;
        }

        const label_text_for_row = (row) => {
          const rounded = Math.round(row.y);
          return row.interpolated
            ? `~${rounded}°`
            : `${rounded}°`;
        };

        const label_box_for = (
          candidate,
          position
        ) => {
          const marker_size =
            candidate.markerSize ??
            cfg.OUTDOOR_TEMP_MARKER_SIZE_PX;
          const marker_radius = marker_size / 2;
          const font_size =
            cfg.OUTDOOR_TEMP_LABEL_FONT_SIZE_PX;
          const text = candidate.labelText;
          const width =
            Math.max(
              18,
              text.length *
                cfg.OUTDOOR_TEMP_LABEL_CHAR_WIDTH_PX +
                4
            );

          // Match Plotly Drawing.textPointPosition() for one-line scatter text.
          const r =
            marker_radius > 0
              ? marker_radius / 0.8 + 1
              : 0;

          const is_top = position.includes("top");
          const is_bottom = position.includes("bottom");
          const is_left = position.includes("left");
          const is_right = position.includes("right");

          const v_sign =
            is_top ? -1 : is_bottom ? 1 : 0;
          const baseline_y =
            candidate.py +
            font_size * 0.75 +
            v_sign * r +
            ((v_sign - 1) * font_size) / 2;

          // Slightly conservative glyph extents around Plotly's 10 px text.
          const ascent = font_size * 0.90 + 1;
          const descent = font_size * 0.30 + 1;

          let left;
          let right;

          if (is_left) {
            // Plotly text-anchor:end with dx=-r.
            right = candidate.px - r;
            left = right - width;
          } else if (is_right) {
            // Plotly text-anchor:start with dx=+r.
            left = candidate.px + r;
            right = left + width;
          } else {
            left = candidate.px - width / 2;
            right = candidate.px + width / 2;
          }

          return {
            left,
            right,
            top: baseline_y - ascent,
            bottom: baseline_y + descent,
            width,
            height: ascent + descent,
            position
          };
        };

        const inside_plot = (box) =>
          box.left >= 0 &&
          box.right <= plot_width &&
          box.top >= 0 &&
          box.bottom <= plot_height;

        const boxes_overlap = (a, b) =>
          !(
            a.right + 2 <= b.left ||
            a.left >= b.right + 2 ||
            a.bottom + 1 <= b.top ||
            a.top >= b.bottom + 1
          );

        // Liang-Barsky line clipping against a label rectangle expanded by a
        // small clearance. `true` means the tested line piece enters the
        // label's protected area.
        const segment_hits_box = (
          x1,
          y1,
          x2,
          y2,
          box
        ) => {
          const pad =
            cfg.OUTDOOR_TEMP_LABEL_LINE_CLEARANCE_PX;
          const marker_pad =
            cfg.OUTDOOR_TEMP_LABEL_MARKER_SIDE_CLEARANCE_PX;

          // Keep the large safety margin away from the marker, but use only
          // a small margin on the edge(s) facing the marker. Otherwise the
          // protected rectangle can include the marker point itself, making
          // every attached line segment a false collision.
          const faces_top =
            box.position?.includes("top");
          const faces_bottom =
            box.position?.includes("bottom");
          const faces_left =
            box.position?.includes("left");
          const faces_right =
            box.position?.includes("right");

          const left =
            box.left - (faces_right ? marker_pad : pad);
          const right =
            box.right + (faces_left ? marker_pad : pad);
          const top =
            box.top - (faces_bottom ? marker_pad : pad);
          const bottom =
            box.bottom + (faces_top ? marker_pad : pad);

          const dx = x2 - x1;
          const dy = y2 - y1;
          let t0 = 0;
          let t1 = 1;

          const clip = (p, q) => {
            if (Math.abs(p) < 1e-9) {
              return q >= 0;
            }

            const r = q / p;

            if (p < 0) {
              if (r > t1) return false;
              if (r > t0) t0 = r;
            } else {
              if (r < t0) return false;
              if (r < t1) t1 = r;
            }

            return true;
          };

          return (
            clip(-dx, x1 - left) &&
            clip(dx, right - x1) &&
            clip(-dy, y1 - top) &&
            clip(dy, bottom - y1)
          );
        };

        const pixel_point = (index) => {
          const row = plotted_rows[index];
          return [
            px_at(row.t),
            py_at(row.y)
          ];
        };

        // Plotly uses a generalized centripetal Catmull-Rom spline
        // (CatmullRomExp = 0.5) for scatter line.shape:spline.
        // This mirrors Drawing.makeTangent() closely enough for collision
        // testing; Plotly's final 0.01 px rounding is intentionally omitted.
        const spline_tangent = (index) => {
          if (
            index <= 0 ||
            index + 1 >= plotted_rows.length ||
            plotted_rows[index - 1]?.y === null ||
            plotted_rows[index]?.y === null ||
            plotted_rows[index + 1]?.y === null
          ) {
            return null;
          }

          const prev = pixel_point(index - 1);
          const cur = pixel_point(index);
          const next = pixel_point(index + 1);

          const d1x = prev[0] - cur[0];
          const d1y = prev[1] - cur[1];
          const d2x = next[0] - cur[0];
          const d2y = next[1] - cur[1];

          const d1a = Math.pow(
            d1x * d1x + d1y * d1y,
            0.25
          );
          const d2a = Math.pow(
            d2x * d2x + d2y * d2y,
            0.25
          );

          const smoothness =
            cfg.OUTDOOR_TEMP_SMOOTHING;
          const numx =
            (
              d2a * d2a * d1x -
              d1a * d1a * d2x
            ) * smoothness;
          const numy =
            (
              d2a * d2a * d1y -
              d1a * d1a * d2y
            ) * smoothness;

          const denom1 =
            3 * d2a * (d1a + d2a);
          const denom2 =
            3 * d1a * (d1a + d2a);

          return [
            [
              cur[0] + (denom1 ? numx / denom1 : 0),
              cur[1] + (denom1 ? numy / denom1 : 0)
            ],
            [
              cur[0] - (denom2 ? numx / denom2 : 0),
              cur[1] - (denom2 ? numy / denom2 : 0)
            ]
          ];
        };

        const quadratic_point = (
          p0,
          c,
          p1,
          t
        ) => {
          const u = 1 - t;
          return [
            u * u * p0[0] +
              2 * u * t * c[0] +
              t * t * p1[0],
            u * u * p0[1] +
              2 * u * t * c[1] +
              t * t * p1[1]
          ];
        };

        const cubic_point = (
          p0,
          c1,
          c2,
          p1,
          t
        ) => {
          const u = 1 - t;
          return [
            u * u * u * p0[0] +
              3 * u * u * t * c1[0] +
              3 * u * t * t * c2[0] +
              t * t * t * p1[0],
            u * u * u * p0[1] +
              3 * u * u * t * c1[1] +
              3 * u * t * t * c2[1] +
              t * t * t * p1[1]
          ];
        };

        const spline_segment_hits_box = (
          i0,
          i1,
          box
        ) => {
          if (
            i0 === null ||
            i1 === null ||
            i1 !== i0 + 1 ||
            plotted_rows[i0]?.y === null ||
            plotted_rows[i1]?.y === null
          ) {
            return false;
          }

          const p0 = pixel_point(i0);
          const p1 = pixel_point(i1);

          const has_prev =
            i0 > 0 &&
            plotted_rows[i0 - 1]?.y !== null;
          const has_next =
            i1 + 1 < plotted_rows.length &&
            plotted_rows[i1 + 1]?.y !== null;

          let curve_point;

          if (!has_prev && !has_next) {
            curve_point = (t) => [
              p0[0] + (p1[0] - p0[0]) * t,
              p0[1] + (p1[1] - p0[1]) * t
            ];
          } else if (!has_prev) {
            const tangent1 = spline_tangent(i1);
            if (!tangent1) {
              curve_point = (t) => [
                p0[0] + (p1[0] - p0[0]) * t,
                p0[1] + (p1[1] - p0[1]) * t
              ];
            } else {
              curve_point = (t) =>
                quadratic_point(
                  p0,
                  tangent1[0],
                  p1,
                  t
                );
            }
          } else if (!has_next) {
            const tangent0 = spline_tangent(i0);
            if (!tangent0) {
              curve_point = (t) => [
                p0[0] + (p1[0] - p0[0]) * t,
                p0[1] + (p1[1] - p0[1]) * t
              ];
            } else {
              curve_point = (t) =>
                quadratic_point(
                  p0,
                  tangent0[1],
                  p1,
                  t
                );
            }
          } else {
            const tangent0 = spline_tangent(i0);
            const tangent1 = spline_tangent(i1);

            if (!tangent0 || !tangent1) {
              curve_point = (t) => [
                p0[0] + (p1[0] - p0[0]) * t,
                p0[1] + (p1[1] - p0[1]) * t
              ];
            } else {
              curve_point = (t) =>
                cubic_point(
                  p0,
                  tangent0[1],
                  tangent1[0],
                  p1,
                  t
                );
            }
          }

          // Subdivide the curve into short micro-segments and test each
          // against the protected label box.
          const chord =
            Math.hypot(
              p1[0] - p0[0],
              p1[1] - p0[1]
            );
          const steps =
            Math.max(
              8,
              Math.min(
                32,
                Math.ceil(chord / 4)
              )
            );

          let prev = curve_point(0);

          for (let s = 1; s <= steps; s++) {
            const cur =
              curve_point(s / steps);

            if (
              segment_hits_box(
                prev[0],
                prev[1],
                cur[0],
                cur[1],
                box
              )
            ) {
              return true;
            }

            prev = cur;
          }

          return false;
        };

        const box_hits_nearby_curve = (
          candidate,
          box
        ) => {
          // At wide zoom an hourly sample can be only 1-3 screen pixels from
          // the next one while the text label is 20-30 px wide. Therefore the
          // line crossing a label may belong to a sample several indices away.
          //
          // Walk outward from the candidate and test every spline segment whose
          // endpoint X interval is near the label's horizontal footprint.
          // Timestamps are monotonic, so once a segment is beyond the search
          // window in either direction we can stop.
          const search_pad =
            cfg.OUTDOOR_TEMP_LABEL_LINE_CLEARANCE_PX + 8;
          const search_left = box.left - search_pad;
          const search_right = box.right + search_pad;

          // Segments to the left: [j, j+1].
          for (
            let j = candidate.i - 1;
            j >= 0;
            j--
          ) {
            if (
              plotted_rows[j]?.y === null ||
              plotted_rows[j + 1]?.y === null
            ) {
              break;
            }

            const x0 = px_at(plotted_rows[j].t);
            const x1 = px_at(plotted_rows[j + 1].t);

            if (Math.max(x0, x1) < search_left) {
              break;
            }

            if (
              Math.min(x0, x1) <= search_right &&
              Math.max(x0, x1) >= search_left &&
              spline_segment_hits_box(j, j + 1, box)
            ) {
              return true;
            }
          }

          // Segments to the right: [j, j+1].
          for (
            let j = candidate.i;
            j + 1 < plotted_rows.length;
            j++
          ) {
            if (
              plotted_rows[j]?.y === null ||
              plotted_rows[j + 1]?.y === null
            ) {
              break;
            }

            const x0 = px_at(plotted_rows[j].t);
            const x1 = px_at(plotted_rows[j + 1].t);

            if (Math.min(x0, x1) > search_right) {
              break;
            }

            if (
              Math.min(x0, x1) <= search_right &&
              Math.max(x0, x1) >= search_left &&
              spline_segment_hits_box(j, j + 1, box)
            ) {
              return true;
            }
          }

          return false;
        };

        const candidate_positions = (
          candidate,
          previous_placed
        ) => {
          const lane =
            candidate.kind === "max"
              ? "top"
              : candidate.kind === "min"
                ? "bottom"
                : candidate.lane;

          const rising = candidate.tempDelta >= 0;
          const steep =
            Number.isFinite(candidate.screenSlope) &&
            Math.abs(candidate.screenSlope) >= 1.2;

          let positions;

          if (lane === "bottom") {
            if (candidate.kind === "min") {
              positions = [
                "bottom center",
                "bottom left",
                "bottom right"
              ];
            } else if (steep) {
              positions = rising
                ? [
                    "bottom right",
                    "bottom center",
                    "bottom left"
                  ]
                : [
                    "bottom left",
                    "bottom center",
                    "bottom right"
                  ];
            } else {
              positions = [
                "bottom center",
                "bottom left",
                "bottom right"
              ];
            }
          } else {
            if (candidate.kind === "max") {
              positions = [
                "top center",
                "top left",
                "top right"
              ];
            } else if (steep) {
              positions = rising
                ? [
                    "top left",
                    "top center",
                    "top right"
                  ]
                : [
                    "top right",
                    "top center",
                    "top left"
                  ];
            } else {
              positions = [
                "top center",
                "top left",
                "top right"
              ];
            }
          }

          // Strong within-run lane continuity, with a softer exact-corner
          // preference. A previous exact position is tried first, but the
          // neighborhood-wide spline intersection test below can veto it. We never
          // add an opposite-lane fallback; if no same-lane position is safe,
          // the label is omitted.
          if (
            previous_placed &&
            candidate.runId >= 0 &&
            previous_placed.runId === candidate.runId &&
            previous_placed.lane === lane &&
            positions.includes(previous_placed.position)
          ) {
            positions = [
              previous_placed.position,
              ...positions.filter(
                (p) => p !== previous_placed.position
              )
            ];
          }

          return positions;
        };

        const find_previous_placed = (
          t,
          accepted
        ) => {
          let previous = null;
          for (const item of accepted) {
            if (
              item.t < t &&
              (!previous || item.t > previous.t)
            ) {
              previous = item;
            }
          }
          return previous;
        };

        const candidates = [];

        for (let j = 0; j < plotted_rows.length; j++) {
          const row = plotted_rows[j];
          if (
            row.y === null ||
            row.t < x0 ||
            row.t > x1
          ) {
            continue;
          }

          const is_endpoint =
            j === 0 ||
            j === plotted_rows.length - 1 ||
            plotted_rows[j - 1]?.y === null ||
            plotted_rows[j + 1]?.y === null;

          const kind =
            extremum_representatives.get(j) ??
            (is_endpoint
              ? "endpoint"
              : (row.interpolated ? "interpolated" : "ordinary"));

          const prev_j =
            j > 0 && plotted_rows[j - 1]?.y !== null
              ? j - 1
              : null;
          const next_j =
            j + 1 < plotted_rows.length &&
            plotted_rows[j + 1]?.y !== null
              ? j + 1
              : null;

          let tempDelta = 0;
          let screenSlope = 0;

          if (prev_j !== null && next_j !== null) {
            tempDelta =
              plotted_rows[next_j].y -
              plotted_rows[prev_j].y;
            const dx =
              px_at(plotted_rows[next_j].t) -
              px_at(plotted_rows[prev_j].t);
            const dy =
              py_at(plotted_rows[next_j].y) -
              py_at(plotted_rows[prev_j].y);
            screenSlope =
              Math.abs(dx) > 0.001 ? dy / dx : Math.sign(dy) * 999;
          } else if (next_j !== null) {
            tempDelta =
              plotted_rows[next_j].y - row.y;
            const dx =
              px_at(plotted_rows[next_j].t) -
              px_at(row.t);
            const dy =
              py_at(plotted_rows[next_j].y) -
              py_at(row.y);
            screenSlope =
              Math.abs(dx) > 0.001 ? dy / dx : Math.sign(dy) * 999;
          } else if (prev_j !== null) {
            tempDelta =
              row.y - plotted_rows[prev_j].y;
            const dx =
              px_at(row.t) -
              px_at(plotted_rows[prev_j].t);
            const dy =
              py_at(row.y) -
              py_at(plotted_rows[prev_j].y);
            screenSlope =
              Math.abs(dx) > 0.001 ? dy / dx : Math.sign(dy) * 999;
          }

          let priority = 1;
          if (!row.interpolated) priority += 1;
          if (kind === "endpoint") priority += 3;
          if (kind === "max" || kind === "min") priority += 6;

          candidates.push({
            i: j,
            t: row.t,
            px: px_at(row.t),
            py: py_at(row.y),
            priority,
            kind,
            lane: lane_by_index[j],
            runId: run_id_by_index[j],
            prevIndex: prev_j,
            nextIndex: next_j,
            tempDelta,
            screenSlope,
            markerSize: vars.outdoor_temp_marker_sizes[j],
            labelText: label_text_for_row(row)
          });
        }

        candidates.sort(
          (a, b) =>
            b.priority - a.priority ||
            a.t - b.t
        );

        const accepted = [];

        for (const candidate of candidates) {
          const previous_placed =
            find_previous_placed(candidate.t, accepted);
          const positions =
            candidate_positions(candidate, previous_placed);

          for (const position of positions) {
            const box = label_box_for(candidate, position);

            if (!inside_plot(box)) continue;

            // Dense-view curve protection is intentionally conditional.
            //
            // - True extrema are always kept eligible: maxima belong above and
            //   minima below, and conservative curve geometry must not erase
            //   the most informative daily labels.
            // - Ordinary/endpoint/interpolated labels use v49's neighborhood
            //   curve veto only while the median sample spacing is small
            //   relative to this label's width. As we zoom in, this condition
            //   turns off, so more labels can appear monotonically.
            const is_true_extremum =
              candidate.kind === "max" ||
              candidate.kind === "min";

            const dense_for_this_label =
              median_sample_dx <
              box.width *
                cfg.OUTDOOR_TEMP_LABEL_CURVE_VETO_DENSITY_FACTOR;

            if (
              !is_true_extremum &&
              dense_for_this_label &&
              box_hits_nearby_curve(candidate, box)
            ) {
              continue;
            }

            let collides = false;
            for (const other of accepted) {
              if (boxes_overlap(box, other.box)) {
                collides = true;
                break;
              }

              // Retain a small additional "same-lane" guard even when boxes
              // narrowly miss, so dense zoomed-out labels do not form a nearly
              // continuous ribbon above or below the curve.
              if (
                Math.abs(candidate.px - other.px) < min_label_px &&
                Math.abs(candidate.py - other.py) < min_label_y_px &&
                Math.abs(box.top - other.box.top) < label_height_px
              ) {
                collides = true;
                break;
              }
            }

            if (collides) continue;

            accepted.push({
              ...candidate,
              position,
              box
            });
            break;
          }
        }

        for (const candidate of accepted) {
          vars.outdoor_temp_text[candidate.i] =
            candidate.labelText;
          vars.outdoor_temp_textposition[candidate.i] =
            candidate.position;
        }

        return null;
      }

    line:
      color: $ex vars.cfg.OUTDOOR_TEMP_COLOR
      width: 2
      shape: spline
      smoothing: $ex vars.cfg.OUTDOOR_TEMP_SMOOTHING

    connectgaps: false

    marker:
      color: $ex vars.cfg.OUTDOOR_TEMP_COLOR
      size: $ex vars.outdoor_temp_marker_sizes
      symbol: circle

    text: $ex vars.outdoor_temp_text
    texttemplate: "%{text}"
    textposition: $ex vars.outdoor_temp_textposition
    textfont:
      color: $ex vars.cfg.OUTDOOR_TEMP_COLOR
      size: 10

    customdata: $ex vars.outdoor_temp_customdata

    hovertemplate: |
      <b>Outdoor Temperature</b><br>
      %{x|%Y-%m-%d %H:%M:%S}<br>
      %{customdata.hover}
      <extra></extra>

