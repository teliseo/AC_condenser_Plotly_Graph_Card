        const original_fetch = cache.fetch.bind(cache);
        cache.__acCondenserV28OriginalGetData = original_get_data;
        cache.__acCondenserV28OriginalFetch = original_fetch;

        // Avoid constructing arrays for the entire accumulated history. Binary
        // search the sorted cache and fill only viewport-adjacent rows directly,
        // avoiding v27's intermediate history.slice() allocation and map passes.
        cache.getData = (entity) => {
          if (
            !entity?.entity ||
            Object.prototype.hasOwnProperty.call(entity, "attribute") ||
            Object.prototype.hasOwnProperty.call(entity, "statistic")
          ) {
            return original_get_data(entity);
          }

          const history = cache.histories?.[entity.entity] ?? [];
          const range = desired_data_range(host);

          if (!range || history.length === 0) {
            return original_get_data(entity);
          }

          const [start, end] = range;

          const lower_bound = (target) => {
            let lo = 0;
            let hi = history.length;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (+history[mid].x < target) lo = mid + 1;
              else hi = mid;
            }
            return lo;
          };

          const upper_bound = (target) => {
            let lo = 0;
            let hi = history.length;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (+history[mid].x <= target) lo = mid + 1;
              else hi = mid;
            }
            return lo;
          };

          // Keep one real point on each side when available. The parser's
          // normal removeOutOfRange() then preserves its existing edge behavior.
          const first = Math.max(0, lower_bound(start) - 1);
          const last = Math.min(history.length, upper_bound(end) + 1);
          const count = Math.max(0, last - first);

          const xs = new Array(count);
          const ys = new Array(count);
          const states = new Array(count);

          for (let i = 0; i < count; i++) {
            const row = history[first + i];
            const state = row.state;
            const y = state?.state;

            xs[i] = row.x;
            states[i] = state;
            ys[i] =
              y === "unavailable" ||
              y === "none" ||
              y === "unknown"
                ? null
                : y;
          }

          if (host.configParser) {
            host.configParser.observed_range = range.slice();
          }

          return {
            xs,
            ys,
            states,
            statistics: []
          };
        };

        // Fetch a small margin beyond the requested viewport. This costs little
        // when zoomed in, is capped at one hour per side, and means nearby
        // follow-up pans can usually reuse Recorder history already in cache.
        cache.fetch = (range, entity, hass) => {
          const normalized = normalize_range(range);
          if (!normalized) {
            return original_fetch(range, entity, hass);
          }

          const [start, end] = normalized;
          const width = end - start;
          const margin = Math.min(
            width * PREFETCH_FRACTION,
            PREFETCH_MAX_MS
          );

          return original_fetch(
            [start - margin, end + margin],
            entity,
            hass
          );
        };

        cache.__acCondenserV28Patched = true;
      };

      const update_button_args = (host, event) => {
        const button_el = event?.composedPath?.().find((el) => {
          const raw = el?.className?.baseVal ?? el?.className ?? "";
          return String(raw).split(/\s+/).includes("updatemenu-button");
        });

        const button = button_el?.__data__;
        if (!button) return;

        const label = String(button.label ?? "");
        const range = normalize_range(host.getVisibleRange?.());
        if (!range) return;

        const [a, b] = range;
        const width = b - a;
        const shift = width / 4;
        const now = Date.now();
        const state = window[STATE_KEY];

        if (label === "◀ ¼") {
          button.execute = true;
          button.args = ["xaxis.range", [a - shift, b - shift]];
          return;
        }

        if (label === "↻ 24h") {
          button.execute = true;
          button.args = [{
            "xaxis.range": [now - 24 * 60 * 60 * 1000, now],
            dragmode: "pan"
          }];
          return;
        }

        if (label === "¼ ▶") {
          if (state.live) {
            // The visual LIVE button will replace this on the next deferred
            // reparse. Until then, do not allow another forward movement.
            button.execute = false;
            return;
          }

          button.execute = true;
          const new_end = Math.min(now, b + shift);
          button.args = [
            "xaxis.range",
            [new_end - width, new_end]
          ];
          return;
        }

        if (label === "LIVE ▷") {
          button.execute = false;
        }
      };

      const install_modebar_style = (host) => {
        const root = host.shadowRoot;
        if (!root || root.querySelector("#ac-condenser-modebar-v35-style")) {
          return;
        }

        const style = document.createElement("style");
        style.id = "ac-condenser-modebar-v35-style";
        style.textContent = `
          /*
           * Plotly writes SVG path fill inline during hover/click. Own the
           * visual state here instead so a momentary hover can never look like
           * a selected mode.
           *
           * Unmanaged/action buttons (Zoom +/-, PNG) never receive .active and
           * therefore remain neutral. Only the actual current mode/toggle gets
           * the HA accent color.
           */
          #plotly .modebar-btn .icon path {
            fill: var(--secondary-text-color) !important;
          }
          #plotly .modebar-btn.active .icon path {
            fill: var(--primary-color) !important;
          }
        `;
        root.appendChild(style);
      };

      const sync_modebar_active = (host) => {
        if (!is_target_card(host)) return;

        const modebar = host.contentEl?.querySelector?.(".modebar");
        if (!modebar) return;

        const full = host.contentEl?._fullLayout ?? {};
        const state = window[STATE_KEY];
        const dragmode =
          full.dragmode ??
          host.contentEl?.layout?.dragmode ??
          "zoom";
        const hovermode =
          full.hovermode ??
          host.contentEl?.layout?.hovermode ??
          "closest";
        const spikes = state.spikes ?? true;

        modebar.querySelectorAll(".modebar-btn").forEach((button) => {
          const attr = button.getAttribute("data-attr");
          const val = button.getAttribute("data-val");
          const title =
            button.getAttribute("data-title") ??
            button.getAttribute("aria-label") ??
            "";

          let managed = false;
          let is_active = false;

          // Mutually exclusive drag modes.
          if (
            attr === "dragmode" &&
            (val === "zoom" || val === "pan")
          ) {
            managed = true;
            is_active = dragmode === val;
          }

          // Mutually exclusive hover modes.
          else if (
            attr === "hovermode" &&
            (
              val === "closest" ||
              val === "x" ||
              val === "y"
            )
          ) {
            managed = true;
            is_active =
              val === "closest"
                ? hovermode === "closest"
                : hovermode === val;
          }

          // Our X-only spike toggle does not use Plotly's native all-axis
          // state, so its active class comes from our persistent state.
          else if (title === "Toggle Spike Lines") {
            managed = true;
            is_active = spikes;
          }

          if (managed) {
            button.classList.toggle("active", is_active);
          } else {
            // Action buttons such as Zoom +/-, Zoom out, and PNG are actions,
            // not persistent modes. They should never look selected.
            button.classList.remove("active");
          }
        });
      };

      const schedule_modebar_sync = (host) => {
        if (host.__acCondenserV35ModebarSyncQueued) return;
        host.__acCondenserV35ModebarSyncQueued = true;

        requestAnimationFrame(() => {
          host.__acCondenserV35ModebarSyncQueued = false;
          install_modebar_style(host);
          sync_modebar_active(host);
        });
      };

      const ensure_host = (host) => {
        if (!is_target_card(host)) return;

        const state = window[STATE_KEY];
        const actual_plot_width =
          Number(host.contentEl?._fullLayout?._size?.w);
        const actual_plot_height =
          Number(host.contentEl?._fullLayout?._size?.h);

        if (Number.isFinite(actual_plot_width) && actual_plot_width > 0) {
          state.plotWidthPx = actual_plot_width;
        } else {
          const fallback_width =
            Number(host.contentEl?.clientWidth) ||
            Number(host.clientWidth);
          if (Number.isFinite(fallback_width) && fallback_width > 0) {
            state.plotWidthPx = Math.max(250, fallback_width - 100);
          }
        }

        if (Number.isFinite(actual_plot_height) && actual_plot_height > 0) {
          state.plotHeightPx = actual_plot_height;
        } else {
          const fallback_height =
            Number(host.contentEl?.clientHeight) ||
            Number(host.clientHeight);
          if (Number.isFinite(fallback_height) && fallback_height > 0) {
            state.plotHeightPx = Math.max(180, fallback_height - 120);
          }
        }

        install_modebar_style(host);

        if (!host.__acCondenserV35ModebarObserver && host.contentEl) {
          // Plotly can create or rebuild the modebar during Plotly.react().
          // Watch DOM construction only; class changes are deliberately not
          // observed, avoiding feedback loops with our own synchronization.
          host.__acCondenserV35ModebarObserver = new MutationObserver(() => {
            schedule_modebar_sync(host);
          });
          host.__acCondenserV35ModebarObserver.observe(host.contentEl, {
            childList: true,
            subtree: true
          });
        }

        if (host.resetButtonEl) {
          host.resetButtonEl.style.display = "none";
        }

        patch_cache(host);

        // Remove v24's auxiliary relayout listener if this YAML was hot-loaded.
        if (host.__acCondenserV24RelayoutHandler) {
          host.contentEl?.off?.(
            "plotly_relayout",
            host.__acCondenserV24RelayoutHandler
          );
          delete host.__acCondenserV24RelayoutHandler;
        }

        if (host.__acCondenserV27RelayoutHandler) {
          host.contentEl?.off?.(
            "plotly_relayout",
            host.__acCondenserV27RelayoutHandler
          );
          delete host.__acCondenserV27RelayoutHandler;
        }

        if (!host.__acCondenserV28StockRelayoutRemoved) {
          // v27 may already have removed this listener; off() is harmless.
          host.contentEl?.off?.("plotly_relayout", host.onRelayout);
          host.__acCondenserV28StockRelayoutRemoved = true;
        }

        if (!host.__acCondenserV28RelayoutHandler) {
          const handler = (event_data) => {
            if (host.isInternalRelayout) return;

            // Persist the user's hover-mode choice across later card reparses
            // such as the 24h reset. Plotly emits hovermode in relayout.
            const requested_hovermode = event_data?.hovermode;
            if (
              requested_hovermode === "closest" ||
              requested_hovermode === "x" ||
              requested_hovermode === "y"
            ) {
              window[STATE_KEY].hovermode = requested_hovermode;
            }

            const requested_dragmode = event_data?.dragmode;
            if (
              requested_dragmode === "zoom" ||
              requested_dragmode === "pan"
            ) {
              window[STATE_KEY].dragmode = requested_dragmode;
            }

            // Relayout is also emitted for dragmode/hovermode changes.
            schedule_modebar_sync(host);

            const range = range_from_relayout(event_data);
            if (!range) return;

            // Update live/browse state immediately, but defer expensive work.
            set_range_mode(host, range);
            schedule_plot(host);
          };

          host.contentEl?.on?.("plotly_relayout", handler);
          host.__acCondenserV28RelayoutHandler = handler;
        }

        // Synchronize after the current render turn. The observer above also
        // catches initial creation and any later Plotly.react() rebuild.
        schedule_modebar_sync(host);
      };

      if (!window[RUNTIME_KEY]) {
        const find_target_cards = () => {
          const found = [];

          const visit = (root) => {
            if (!root?.querySelectorAll) return;

            root.querySelectorAll("*").forEach((el) => {
              if (is_target_card(el)) found.push(el);
              if (el.shadowRoot) visit(el.shadowRoot);
            });
          };

          visit(document);
          return found;
        };

        const initialize_visible_cards = () => {
          find_target_cards().forEach((host) => {
            ensure_host(host);
            schedule_modebar_sync(host);
          });
        };

        // meta is evaluated before Plotly.react() completes. Retry discovery
        // briefly so initial active state appears without any user interaction.
        const initialize_timer_ids = [0, 50, 150, 350, 750].map((delay) =>
          setTimeout(initialize_visible_cards, delay)
        );

        // Intercept the built-in Plotly spike toggle BEFORE its own click
        // handler runs. Plotly's native toggle intentionally changes every
        // Cartesian axis and maintains a global _cartesianSpikesEnabled flag;
        // correcting it afterward leaves that flag out of sync.
        const on_click = (event) => {
          const host = card_from_event(event);
          if (!host) return;

          const button_el = event?.composedPath?.().find((el) => {
            const raw = el?.className?.baseVal ?? el?.className ?? "";
            return String(raw).split(/\s+/).includes("modebar-btn");
          });

          if (!button_el) return;

          const title =
            button_el.getAttribute?.("data-title") ??
            button_el.getAttribute?.("aria-label") ??
            "";

          if (title === "Toggle Spike Lines") {
            // Prevent Plotly's own all-axis click handler from seeing this click.
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            ensure_host(host);

            const state = window[STATE_KEY];
            state.spikes = !(state.spikes ?? true);

            // Re-render from already-cached data. The xaxis.showspikes function
            // reads state.spikes; both Y-axis spikes remain false.
            Promise.resolve(
              host.plot({should_fetch: false})
            ).then(() => {
              schedule_modebar_sync(host);
            });
            return;
          }

          // Let Plotly handle Zoom/Pan and Closest/Compare normally. Its click
          // handler updates fullLayout; synchronize immediately afterward so
          // active state is obvious even if the theme/default styling is subtle.
          if (
            title === "Zoom" ||
            title === "Pan" ||
            title === "Show closest data on hover" ||
            title === "Compare data on hover"
          ) {
            requestAnimationFrame(() => {
              schedule_modebar_sync(host);
            });
          }
        };

        // Capture runs before Plotly's own button/drag/wheel handlers, allowing
        // us to install the optimized relayout listener before the first
        // plotly_relayout is emitted.
        const on_pointerdown = (event) => {
          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);

          // Native Plotly button args are otherwise frozen at the previous
          // card parse. Refresh them from the current displayed X range so
          // rapid repeated quarter-pan clicks accumulate without waiting.
          update_button_args(host, event);
        };

        const on_touchstart = (event) => {
          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);
          update_button_args(host, event);
        };

        const on_wheel = (event) => {
          const host = card_from_event(event);
          if (host) ensure_host(host);
        };

        // Preserve the proven v26 legend/live behavior. Legend restyle remains
        // intentionally outside the relayout debounce because it is infrequent.
        const is_legend_event = (event) =>
          event?.composedPath?.().some((el) => {
            const raw =
              el?.className?.baseVal ??
              el?.className ??
              "";
            const cls = String(raw);
            return (
              cls.includes("legend") ||
              cls.includes("traces")
            );
          });

        const on_pointerup = (event) => {
          if (!is_legend_event(event)) return;

          const host = card_from_event(event);
          if (!host) return;
          ensure_host(host);

          const state = window[STATE_KEY];
          if (!state.live) return;

          const double_click_delay =
            host.contentEl?._context?.doubleClickDelay ?? 300;

          clearTimeout(host.__acCondenserLegendLiveTimer);
          host.__acCondenserLegendLiveTimer = setTimeout(() => {
            if (!state.live) return;

            host.isBrowsing = false;
            if (host.resetButtonEl) {
              host.resetButtonEl.style.display = "none";
            }

            const range = desired_data_range(host);
            if (range && host.configParser) {
              host.configParser.observed_range = range.slice();
            }
          }, double_click_delay + 350);
        };

        window.addEventListener("click", on_click, true);
        window.addEventListener("pointerdown", on_pointerdown, true);
        window.addEventListener("touchstart", on_touchstart, true);
        window.addEventListener(
          "wheel",
          on_wheel,
          {capture: true, passive: true}
        );
        window.addEventListener("pointerup", on_pointerup, true);

        window[RUNTIME_KEY] = {
          ensure_host,
          sync_modebar_active,
          schedule_modebar_sync,
          initialize_timer_ids,
          on_click,
          on_pointerdown,
          on_touchstart,
          on_wheel,
          on_pointerup
        };
      }

      return "ac-condenser-v44";
    }

  # In a Panel view, this makes the graph approximately fill the browser
  # viewport vertically as well as horizontally. Adjust 70 if your HA
  # header/navigation consumes a different amount of vertical space.
  height: $ex Math.max(100, window.innerHeight - 70)

  # Preserve Zoom/Pan across ordinary reparses. The 24h button explicitly
  # writes dragmode: pan, so that navigation action also becomes persistent.
  dragmode: |
    $fn () => {
      window.__acCondenserPlotV22State ??= {
        power: true,
        stage2: false,
        live: true,
        liveHours: 24
      };
      return window.__acCondenserPlotV22State.dragmode ?? "pan";
    }

  # Preserve the user's Closest vs Compare choice across 24h/reset reparses.
  # Default remains normal per-point closest hover.
  hovermode: |
    $fn () => {
      window.__acCondenserPlotV22State ??= {
        power: true,
        stage2: false,
        live: true,
        liveHours: 24
      };
      return window.__acCondenserPlotV22State.hovermode ?? "closest";
    }

  legend:
    orientation: h
    x: 0
    xanchor: left
    # Put the legend just above the plotting rectangle.
    "y": 1.02
    yanchor: bottom
    itemdoubleclick: false

  xaxis:
    # Prevent drag/wheel/button panning into the future. This value is
    # re-evaluated whenever the card replots.
    maxallowed: $ex Date.now()

    showspikes: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.spikes ?? true;
      }
    spikemode: across
    spikesnap: data
    spikedash: dash
    spikethickness: 1
    spikecolor: "#808080"

  # One horizontal menu is intentional. Plotly applies 12 px of text
  # padding to each side of every button and a 2 px gap between adjacent
  # buttons, so the whitespace on both sides of ↻ 24h is exactly equal.
  updatemenus:
    - buttons:
        - label: "◀ ¼"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const shift = (b - a) / 4;
                return [a - shift, b - shift];
              }

        - label: "↻ 24h"
          method: relayout
          args:
            - |
              $fn () => {
                const end = Date.now();
                return {
                  "xaxis.range": [
                    end - 24 * 60 * 60 * 1000,
                    end
                  ],
                  dragmode: "pan"
                };
              }

        # Historical forward control. Hidden while live.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return !window.__acCondenserPlotV22State.live;
            }
          label: "¼ ▶"
          method: relayout
          args:
            - xaxis.range
            - |
              $fn ({getFromConfig}) => {
                const raw = getFromConfig("visible_range");
                const fallback_end = Date.now();
                const fallback_start =
                  fallback_end - 24 * 60 * 60 * 1000;
                const r =
                  Array.isArray(raw) && raw.length === 2
                    ? raw
                    : [fallback_start, fallback_end];

                const to_ms = (v) => {
                  if (typeof v === "number") return v;
                  if (v instanceof Date) return v.getTime();
                  const ms = new Date(v).getTime();
                  return Number.isFinite(ms) ? ms : NaN;
                };

                const a = to_ms(r[0]);
                const b = to_ms(r[1]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                  return [fallback_start, fallback_end];
                }

                const width = b - a;
                const shift = width / 4;
                const now = Date.now();
                const new_end = Math.min(now, b + shift);
                return [new_end - width, new_end];
              }

        # Live/right-edge indicator occupies the exact same third-button slot.
        # execute:false makes it inert. The hollow arrow distinguishes the
        # disabled state without requiring a separately-positioned menu.
        - visible: |
            $fn () => {
              window.__acCondenserPlotV22State ??= {
                power: true,
                stage2: false,
                live: true,
                liveHours: 24
              };
              return window.__acCondenserPlotV22State.live;
            }
          label: "LIVE ▷"
          method: skip
          execute: false

      direction: right
      active: -1
      showactive: false
      type: buttons
      bgcolor: "rgba(0,0,0,0)"
      bordercolor: "rgba(0,0,0,0)"
      borderwidth: 0
      font:
        size: 12
      x: 0.42
      xanchor: left
      "y": 1.02
      yanchor: bottom
      pad:
        l: 0
        r: 0
        t: 0
        b: 0

  yaxis:
    showspikes: false
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.power;
      }
    title:
      text: Power (W)
    range: $ex [vars.cfg.Y_MIN_W, vars.cfg.Y_MAX_W]
    fixedrange: true

  yaxis2:
    showspikes: false
    visible: |
      $fn () => {
        window.__acCondenserPlotV22State ??= {
          power: true,
          stage2: false,
          live: true,
          liveHours: 24
        };
        return window.__acCondenserPlotV22State.stage2;
      }
    title:
      text: Stage 2 (mA)
    range:
      - 0
      - 120
    fixedrange: true

  # Third overlaid scale used only to position Outdoor Temperature. Keep the
  # axis itself invisible so there is no third tick/title scale competing with
  # Power and Stage 2; each temperature sample is labeled directly.
  yaxis3:
    visible: false
    showspikes: false
    range: $ex [vars.cfg.OUTDOOR_TEMP_MIN_F, vars.cfg.OUTDOOR_TEMP_MAX_F]
    fixedrange: true

config:
  # Y is fixed, so wheel/drag zooming affects the time axis.
  scrollZoom: true

  # Explicit modebar policy. Keep PNG export and the normal zoom/pan controls.
  # Remove generic axis-reset controls (they bypass this card's X-history logic)
  # and point-selection controls, which have no consumer here.
  modeBarButtonsToRemove:
    - autoScale2d
    - resetScale2d
    - lasso2d
    - select2d

  # "Compare data on hover" is not itself a toggle, so expose the matching
  # "Show closest data on hover" control as the way back to the default mode.
  # Toggle Spike Lines lets the normally-on vertical spike line be switched.
  modeBarButtonsToAdd:
    - togglespikelines
    - hoverclosest
    - hovercompare
